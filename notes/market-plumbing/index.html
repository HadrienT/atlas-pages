  const b={X:80,Y:60,W:500,H:300,a:0,b:.3,lo:0,hi:80};d.axes(80,60,500,300,{x:'Q / ADV (0 to 30%)',y:'impact (bp)',at:0});
  d.plot(x=>0.7*200*Math.sqrt(x),b,{at:.4,c:LIME,dur:1.2});d.plot(x=>0.7*200*x*1.83,b,{at:.6,c:MUTE,dur:1.2});
  [[0,'0'],[.1,'10%'],[.2,'20%'],[.3,'30%']].forEach(([x,s])=>d.text(80+500*x/.3,384,s,{size:11,mono:1,fill:MUTE,at:0}));[[0,'0'],[40,'40'],[80,'80']].forEach(([v,s])=>d.text(70,360-300*v/80+4,s,{size:11,mono:1,anchor:'end',fill:MUTE,at:0}));
  d.text(330,150,'√ law: Y=0.7, σ=2%',{size:13,mono:1,fill:LIME,at:1});d.text(470,92,'linear',{size:13,mono:1,fill:MUTE,at:1});
  d.tag(80+500*.1/.3,360-300*44/80-18,'10% ADV ≈ 44 bp',{at:1.6});
  d.pill('Trading twice the size costs about 1.4× per share',2.2)},
  deep:P(`Liquidity has several dimensions: <b>tightness</b> (spread), <b>depth</b> (size), <b>resilience</b> (refill speed) and <b>immediacy</b>. Each has its own measures.`)+
  T(['Measure','Formula','What it says'],[
   ['Quoted spread','(ask − bid) / mid','What is displayed'],
   ['Effective spread','2 × side × (P_trade − mid) / mid, side = +1 buy, −1 sell','What a trade actually paid, including price improvement or sweeping'],
   ['Realised spread','2 × side × (P_trade − mid at t+Δ) / mid','What the maker kept after the price moved; effective minus realised is adverse selection'],
   ['Amihud illiquidity','|daily return| / daily traded value','Price move per unit of volume, from daily data'],
   ['Kyle\'s lambda','ΔP = λ × signed order flow','Price sensitivity to net order flow, from Kyle (1985)'],
   ['Roll estimator','2 √(−cov(ΔP_t, ΔP_t−1))','Spread implied by bid-ask bounce in trade prices']])+
  H('The square-root law')+P(`Across markets and decades, the average price impact of a large order executed over a day (a metaorder) follows:`)+EQ('impact ≈ Y × σ_daily × √(Q / V_daily),   Y ≈ 0.5 to 1')+
  EX('Worked example (example)',P(`A stock with 2% daily volatility. You buy 10% of ADV. With Y = 0.7: impact ≈ 0.7 × 2% × √0.1 = 0.7 × 2% × 0.316 ≈ 0.44%, or 44 bp. At 20% of ADV: 0.7 × 2% × 0.447 ≈ 63 bp. Doubling the size raises impact per share by √2 ≈ 1.41, so total cost rises by about 2.8.`))+
  H('Temporary and permanent impact')+P(`During execution the price is pushed by the order's own pressure (<b>temporary impact</b>). After it ends, impact decays partially (part of the move was liquidity, part was information). What remains is <b>permanent impact</b>, often estimated at around half to two thirds of the peak. Propagator models (Bouchaud and co-authors) describe this decay as a kernel applied to past order flow. Execution models such as Almgren-Chriss use a linear temporary and permanent impact for tractability (see <a href="#algos">Execution algorithms</a>).`)+
  H('Who uses this')+UL([`Execution quants: to forecast cost, choose a schedule, and do pre-trade TCA.`,`Principal desks: to price risk trades and portfolio bids.`,`Portfolio managers: to know capacity, the size beyond which a strategy's costs eat its alpha.`,`Risk: liquidity horizons and liquidation costs in stress.`])},

 {id:'auctions',name:'Auctions, halts and circuit breakers',desc:'Opening, closing and volatility auctions',tag:'AUCTION',
  chips:['opening auction','closing auction','uncrossing','random end','volatility interruption','LULD'],
  facts:[['Call phase','Orders accumulate; an indicative price is published'],['Uncrossing','One price that maximises executed volume'],['Close','The closing price is the benchmark for funds and indices'],['Protections','Volatility interruptions in the EU, LULD and circuit breakers in the US']],
  label:'Uncrossing / one price maximises volume (example)',steps:['During the call, buy and sell orders accumulate without trading.','Cumulative demand falls with price, cumulative supply rises.','The auction price is where the executable volume is largest.'],draw(){
  d.axes(80,60,500,300,{x:'price',y:'cumulative qty',at:0});
  const b={X:80,Y:60,W:500,H:300,a:0,b:1,lo:0,hi:1};d.plot(x=>.95-.85*x,b,{at:1,c:LIME,dur:1});d.plot(x=>.1+.8*x*x+.05,b,{at:1.2,c:VIOLET,dur:1});
  d.text(130,94,'buy (demand)',{size:13,mono:1,fill:LIME,anchor:'start',at:1});d.text(560,96,'sell (supply)',{size:13,mono:1,fill:VIOLET,anchor:'end',at:1.2});
  const x0=.601;d.line([[80+500*x0,60],[80+500*x0,360]],{at:2,c:WARN,dash:1});d.tag(80+500*x0,392,'auction price',{at:2,c:WARN});
  d.pill('One price, one big trade, no time priority race',2.4)},
  deep:P(`Continuous trading is bracketed by <b>call auctions</b>. During the call phase, orders are entered and cancelled but nothing trades. The venue publishes an indicative price and volume. At the end, all orders are matched at a single <b>uncrossing</b> price.`)+
  H('How the price is chosen')+OL([`Maximise executable volume.`,`If several prices tie, minimise the surplus (the imbalance left unmatched).`,`If still tied, look at market pressure (which side has the surplus).`,`If still tied, use the price closest to a reference price, such as the last trade.`])+
  P(`European venues add a <b>random end</b> of up to 30 seconds or so, so nobody can place a last-millisecond order that moves the price. Market orders execute first, then limit orders by price.`)+
  H('Why the close matters so much')+P(`Index funds, ETFs and most benchmarks value at the official closing price, and derivatives settle on it. Funds that must track an index trade in the closing auction, so a large and growing share of daily volume trades there, especially on index rebalance days. For an execution desk, the close is a liquidity pool of its own, and VWAP algos plan how much to keep for it.`)+
  H('Halts and volatility protections')+UL([`<b>Volatility interruptions</b> (EU): if a trade would happen too far from a static or dynamic reference price, continuous trading stops and a short auction starts.`,`<b>Limit Up-Limit Down</b> (US): each stock has a price band around a recent average; if it cannot trade inside it, a 5-minute pause follows.`,`<b>Market-wide circuit breakers</b> (US): trading on all exchanges stops if the S&P 500 falls 7%, 13% or 20% from the previous close, with rules depending on the time of day.`,`<b>Regulatory halts</b>: pending news, or at the issuer's request.`])+
  P(`For an algo, a halt is an event to handle: stop sending, keep or cancel resting orders, reschedule the remaining quantity.`)},

 {id:'fees',name:'Fees, rebates and adverse selection',desc:'Why a fill can be bad news',tag:'TOXICITY',
  chips:['maker-taker','inverted','rebate','markout','adverse selection','toxic flow'],
  facts:[['Maker-taker','Taker pays a fee, maker gets a rebate'],['Inverted','The opposite, to attract takers'],['Markout','Mid at t+Δ minus fill price, signed'],['Adverse selection','You get filled when you are wrong']],
  label:'Markouts / filled buys against two client types (example)',steps:['After each fill, track the mid over the next minutes.','Against uninformed flow, the mid stays near the fill price.','Against informed flow, it keeps moving away: you were picked off.'],draw(){
  d.axes(80,60,500,300,{x:'time after fill (0 to 5 min)',y:'markout (bp)',at:0});
  d.line([[80,210],[580,210]],{at:0,c:'#3a4a3e'});d.text(70,214,'0',{size:11,mono:1,anchor:'end',fill:MUTE,at:0});
  d.line([[80,210],[130,206],[180,205],[280,207],[380,206],[580,207]],{at:1,c:LIME,dur:1});d.text(590,200,'retail',{size:13,mono:1,fill:LIME,anchor:'end',at:1.2});
  d.line([[80,210],[130,240],[180,262],[280,288],[380,300],[580,310]],{at:2,c:CORAL,dur:1});d.text(590,330,'informed',{size:13,mono:1,fill:CORAL,anchor:'end',at:2.2});
  d.pill('A maker earns the spread and loses the markout',2.5)},
  deep:H('Fee models')+P(`Many equity venues use <b>maker-taker</b> pricing: an aggressive order pays a fee (a fraction of a cent per share in the US, a fraction of a basis point in Europe) and the passive order it hits receives a rebate. <b>Inverted</b> venues pay takers and charge makers, to attract aggressive flow. Futures exchanges charge per contract, often with discounts for market makers who commit to quote. Fees are small per trade but decisive for high-frequency strategies, whose gross edge is often a fraction of a tick.`)+
  H('Adverse selection')+P(`A passive order is an option given away for free: anyone can trade against it when it suits them. If the person who hits your bid knows the price is about to fall, you buy just before it drops. The <b>markout</b> measures this:`)+
  EQ('markout(Δ) = side × (mid(t + Δ) − fill price) / fill price')+
  P(`Computed at several horizons (100 ms, 1 s, 10 s, 1 min, 5 min) and averaged by client, venue or strategy, it tells a maker which flow is profitable. Retail flow tends to have flat markouts, which is why wholesalers pay to internalise it. Flow from fast arbitrageurs has strongly negative markouts for the maker.`)+
  H('Decomposition of a maker\'s P&L')+EQ('maker P&L per trade ≈ half-spread + rebate − adverse selection − inventory cost')+
  P(`This is why market makers segment clients (tiered pricing in FX, different spreads by client in RFQ markets), use last look in FX (see <a href="#fx-stream">FX streaming</a>), and why exchanges add speed bumps or randomisation to protect resting orders.`)+
  QA(`"You quote a tight spread and trade a lot, but lose money. Why?"`,`Adverse selection: your fills are concentrated on informed flow. Check markouts by counterparty and venue, widen or skew against toxic flow, and look at your latency relative to the fastest participants.`)},
]},

{id:'infra',name:'Infrastructure',sub:'Colocation, networks, feeds and the microseconds in between.',rows:[
 {id:'colo',name:'Colocation',desc:'Renting a rack next to the matching engine',tag:'COLO',
  chips:['NY4/NY5','Mahwah','Carteret','Aurora','FR2','Bergamo','LD4','cross-connect'],
  facts:[['What','Your servers in the exchange\'s data centre'],['Why','Light covers about 200 m per microsecond in fibre'],['Fairness','Venues equalise cable lengths for all clients'],['What you rent','Cabinet, power, cross-connects, market data handoff'],['Examples','NYSE: Mahwah; Nasdaq: Carteret; CME: Aurora; Eurex: Equinix FR2; Euronext: Bergamo']],
  label:'Data centre / one exchange, many racks (example)',steps:['The exchange cage holds its gateways, matching engines and feed publishers.','Members rent racks in the same building.','Each rack gets cross-connects of identical length to the exchange.'],draw(){
  d.box(205,52,240,110,'Exchange cage','gateways · matching · feeds',{at:0,hl:.3,c:VIOLET});
  [['Bank A',24],['HFT B',143],['Broker C',262],['MM D',381],['Fund E',500]].forEach(([s,x],i)=>{d.box(x,330,126,80,s,'rack',{at:1+i*.07,size:15});});
  [87,206,325,444,563].forEach((x,i)=>{d.line([[x,330],[x,260],[325,200],[325,162]],{at:2+i*.05,c:LIME,dur:.6})});
  d.tag(325,230,'equal-length cross-connects',{at:2.3});
  d.pill('Distance is latency, so everyone moves in next door',2.6)},
  deep:P(`Light in optical fibre travels at about two thirds of its speed in vacuum: roughly 200 metres per microsecond, or 5 microseconds per kilometre. A trading server in an office 30 km from the exchange is therefore 150 µs away one way before any processing, while a market maker's server in the same building is a few hundred nanoseconds away. For strategies that compete on reaction time, that settles it: they must be in the same data centre.`)+
  H('What colocation means in practice')+UL([`The venue (or the data centre operator, such as Equinix or CyrusOne) rents <b>cabinets</b> (racks) in the building that hosts its matching engines, with a fixed power budget (for example 5 to 15 kW per rack).`,`Each rack is connected to the exchange network by <b>cross-connects</b>: physical fibres to the order-entry gateways and to the market data distribution switches. Most venues make all these cables the same length, coiling the extra fibre for the closer racks, so that no member gains from rack position.`,`Members install their own servers, network switches (often <b>layer 1 switches</b> that copy a signal in a few nanoseconds), FPGA cards and timing equipment (GPS antenna or PTP feed).`,`Costs: monthly fees for space, power, each cross-connect, and market data licences, which can add up to tens of thousands of dollars per month per venue.`])+
  H('Where the engines are')+T(['Venue','Data centre (approximate)'],[['NYSE group','Mahwah, New Jersey'],['Nasdaq','Carteret, New Jersey'],['Cboe US equities, many ECNs, FX venues','Equinix NY4/NY5, Secaucus, New Jersey'],['CME Group','Aurora, Illinois'],['Eurex, Xetra','Equinix FR2, Frankfurt'],['Euronext','Bergamo, Italy (since 2022)'],['FX (EBS, LSEG)','Around London (LD4, Slough), New York, Tokyo']])+
  P(`Banks typically colocate their electronic market-making and their smart order routers, and run the rest (risk, booking, client connectivity) in their own data centres. A trading firm with presence in several venues ends up with a <b>network of colocation sites</b> linked by the fastest possible lines (see next chapter).`)+
  H('Proximity hosting and cloud')+P(`Venues also offer <b>proximity hosting</b> in nearby buildings, which is cheaper and slightly slower. Some venues have started to move parts of their infrastructure to dedicated cloud regions; for latency-sensitive matching the physical rules above still apply.`)},

 {id:'links',name:'Between data centres',desc:'Fibre, microwave and the Chicago–New Jersey race',tag:'NETWORK',
  chips:['fibre','microwave','millimetre wave','shortwave','weather fade','cash-futures arbitrage'],
  facts:[['Fibre','About 5 µs per km, and fibre routes are never straight'],['Microwave','Close to the speed of light in air, nearly straight line'],['Chicago–NJ','Roughly 6.5 ms one way by the best fibre, about 4 ms by microwave'],['Trade-off','Microwave is faster but has less bandwidth and fades in rain']],
  label:'Chicago to New Jersey / one way (approximate)',steps:['Futures trade in Aurora; the shares and ETFs trade in New Jersey.','Fibre follows roads and rail: about 6.5 ms one way at best.','Microwave towers fly almost straight: about 4 ms. The gap is the arbitrage.'],draw(){
  d.box(24,200,150,70,'Aurora','CME futures',{at:0,hl:.2,c:VIOLET});d.box(476,120,150,60,'Mahwah','NYSE',{at:0});d.box(476,205,150,60,'Secaucus','NY4/NY5',{at:.05});d.box(476,290,150,60,'Carteret','Nasdaq',{at:.1});
  d.line([[174,250],[230,300],[300,320],[360,300],[420,320],[476,320]],{at:1,c:MUTE,dur:1.2});d.text(320,350,'fibre ≈ 6.5 ms',{size:14,mono:1,fill:SOFT,at:1.3});
  d.line([[174,226],[476,232]],{at:2,c:LIME,dur:.6});d.text(320,214,'microwave ≈ 4.0 ms',{size:14,mono:1,fill:LIME,at:2.1});
  d.packet([[174,226],[476,232]],2.1,{dur:.9});
  d.pill('2.5 ms is a lifetime: futures lead, cash follows',2.5)},
  deep:P(`Many prices are linked across venues: an S&P 500 future in Chicago and the SPY ETF and its components in New Jersey; the Bund future in Frankfurt and German bonds in London; the same FX pair in London, New York and Tokyo. When one moves, the other must follow, and whoever learns first can trade the lagging venue before it updates. So the links between data centres are a battlefield.`)+
  EX('The physics (approximate figures)',UL([`Straight-line distance Aurora to northern New Jersey: about 1,150 to 1,200 km.`,`Light in vacuum (and nearly in air): 3.34 µs per km, so about 3.9 ms one way as the crow flies.`,`Light in fibre: about 4.9 µs per km, and fibre routes are longer than the straight line. The best dedicated fibre achieves roughly 6.5 ms one way.`,`Microwave networks on towers along an almost straight path achieve about 4 ms one way, within a few percent of the physical limit.`]))+
  H('Trade-offs')+UL([`<b>Microwave</b> and <b>millimetre wave</b>: fastest, but low bandwidth, so firms send only the few fields they need (best prices of a few instruments), and links fade in heavy rain. Firms keep fibre as a backup and arbitrate in real time.`,`<b>Shortwave (HF) radio</b>: bounces off the ionosphere, used by some firms on transatlantic routes such as Chicago to Europe, with very small bandwidth and high error rates.`,`<b>Hollow-core fibre</b>: light travels mostly in air inside the fibre, about 30% faster than standard fibre, used on shorter routes.`])+
  H('Who builds them')+P(`Specialist providers sell access to shared networks; the largest market makers build or lease their own tower routes. The race has turned the speed of light into a cost of doing business, which is one reason electronic market making is concentrated in a few firms.`)+
  H('Why a bank cares')+P(`A bank's electronic market-making desk (ETFs, futures hedging, FX) faces the same race. A bank that quotes an ETF in New Jersey and hedges in Chicago futures with a slow link will be picked off on every move: its quotes become stale before it can update them. That is adverse selection driven by geography.`)},

 {id:'feed',name:'Market data feed handling',desc:'From multicast packets to a local book',tag:'FEED',
  chips:['UDP multicast','A/B feeds','sequence numbers','gap','snapshot','ITCH','SBE','MDP 3.0','EOBI'],
  facts:[['Transport','UDP multicast, two identical lines A and B'],['Arbitration','Take the first copy of each sequence number'],['Gap','Missing number: request a retransmission or rebuild from a snapshot'],['Decode','Binary formats: ITCH, SBE (CME MDP 3.0), EOBI'],['Output','A local copy of the book, updated per message']],
  label:'Feed handler / packets to book',steps:['The venue publishes every event twice, on lines A and B.','The handler keeps the first copy of each sequence number and spots gaps.','It decodes each message and updates its local book.'],draw(){
  d.box(24,80,140,56,'Line A','multicast',{at:0,size:15});d.box(24,190,140,56,'Line B','multicast',{at:0,size:15});
  d.packet([[164,108],[240,150]],0.1,{dur:1});d.packet([[164,218],[240,170]],0.15,{dur:1.1,c:VIOLET});
  d.box(240,120,170,80,'Arbitration','first copy wins',{at:1,hl:1.2});d.arrow([[164,108],[240,150]],{at:.05,c:MUTE});d.arrow([[164,218],[240,170]],{at:.05,c:MUTE});
  d.box(456,120,170,80,'Gap?','seq 1042 missing',{at:1.3,hl:1.5,c:CORAL});d.arrow([[410,160],[456,160]],{at:1.3,c:MUTE});
  d.box(456,250,170,60,'Recovery','retransmit, snapshot',{at:1.6,size:15,c:WARN,hl:1.8});d.line([[541,200],[541,250]],{at:1.6,c:WARN});
  d.box(240,250,170,60,'Decoder','ITCH, SBE',{at:2,size:15});d.arrow([[325,200],[325,250]],{at:2,c:LIME});
  d.box(240,350,170,70,'Local book','add, modify, delete',{at:2.2,hl:2.4});d.arrow([[325,310],[325,350]],{at:2.2,c:LIME});
  d.pill('A wrong book is worse than a slow one',2.6)},
  deep:P(`Exchanges publish market data as a stream of small binary messages over <b>UDP multicast</b>: one packet goes to everyone subscribed, with no acknowledgement. This is fast and fair, but packets can be lost, so the design has three safety nets.`)+
  OL([`<b>Two lines (A and B).</b> Every message is published twice on separate networks. The feed handler reads both and keeps whichever copy of a given sequence number arrives first (<b>line arbitration</b>).`,`<b>Sequence numbers.</b> Every message carries one. If number 1042 is missing on both lines, the book is no longer trustworthy for that instrument.`,`<b>Recovery.</b> The handler either requests a retransmission over a TCP recovery service, or joins a <b>snapshot</b> channel that periodically publishes the full book, then replays buffered incremental messages from the snapshot's sequence number. Until it has recovered, the strategy must stop trading that instrument.`])+
  H('What the messages look like')+P(`Market-by-order feeds such as Nasdaq ITCH are a log of order events. A few ITCH message types:`)+
  T(['Type','Message','Effect on the book'],[['A / F','Add order (F with the member\'s ID)','Insert an order with an ID, side, price and size at the back of its queue'],['E','Order executed','Reduce the order\'s size; a trade happened at its price'],['C','Executed with price','Same, at a different price (for example in an auction)'],['X','Order cancel','Reduce the size'],['D','Order delete','Remove the order'],['U','Order replace','Delete and add with a new ID (loses priority)'],['P','Trade (non-displayed)','A hidden order traded; no book change'],['Q','Cross trade','Auction result']])+
  P(`CME's MDP 3.0 uses <b>SBE</b> (Simple Binary Encoding): fixed-layout messages that can be read without parsing, field by field at known offsets. Eurex publishes EOBI (order by order) and EMDI (by price level). All of them are designed so that a decoder needs a few tens of nanoseconds per message.`)+
  H('Book building')+P(`The handler keeps, for each instrument, a structure of price levels with their queues of orders, indexed by order ID for fast updates. For speed, implementations use arrays indexed by price offset from a reference rather than trees, preallocated memory, and a hash map from order ID to position. Each update yields an event for strategies: top-of-book changed, a trade, a level emptied.`)+
  H('Direct feeds and consolidated feeds')+P(`In US equities, the official consolidated feed (the SIP) aggregates all exchanges, but it is slower than reading each exchange's direct feed in its own data centre. Fast participants build their own consolidated view from direct feeds, which is legal and is one of the structural advantages of speed.`)},

 {id:'tick-to-trade',name:'Tick to trade',desc:'The latency budget of one reaction',tag:'LATENCY',
  chips:['wire to wire','NIC','decode','signal','risk check','encode','p99 jitter'],
  facts:[['Definition','From the market data packet arriving to the order leaving'],['Tuned software','A few microseconds (example)'],['FPGA','Hundreds of nanoseconds or less'],['What matters','The tail (p99, p99.9), not just the median'],['Beyond','Exchange round trip adds tens of microseconds']],
  label:'Budget / one reaction in tuned software (example)',steps:['A packet arrives at the network card.','Each stage adds hundreds of nanoseconds.','The order leaves about 2.7 µs later. An FPGA does it in a fraction of that.'],draw(){
  const S=[['NIC in',.3,MUTE],['decode',.4,VIOLET],['book',.2,VIOLET],['signal',.8,LIME],['decide',.3,LIME],['risk',.2,WARN],['encode',.2,CYAN],['NIC out',.3,MUTE]];
  let x=24;const W=602/2.7;S.forEach(([s,v,c],i)=>{const w=W*v;d.bar(x,120,w-3,70,{at:1+i*.12,c,op:.75,dur:.3});d.text(x+w/2,214+(i%2)*22,s,{size:12,mono:1,fill:c,at:1+i*.12});d.text(x+w/2,160,v.toFixed(1),{size:12,mono:1,fill:'#06110a',at:1+i*.12});x+=w});
  d.text(24,100,'µs',{size:12,mono:1,fill:MUTE,anchor:'start',at:0});d.packet([[24,90],[110,90]],0,{dur:.8,once:1});
  d.count(325,320,2.7,2,{size:44,w:500,unit:' µs',dec:1});d.text(325,356,'tick to trade (example)',{size:13,mono:1,fill:MUTE,at:2});
  d.text(325,404,'FPGA path: ≈ 0.1–0.5 µs',{size:15,mono:1,fill:LIME,at:2.2});
  d.pill('Then the exchange adds its own tens of microseconds',2.5)},
  deep:P(`<b>Tick to trade</b> is the time between a market data packet reaching your network card and your order packet leaving it. It is the part of the reaction you control. Firms measure it <b>wire to wire</b>, with a network tap that timestamps packets in and out in hardware, so the measure includes everything.`)+
  T(['Stage','What happens','Order of magnitude (example)'],[
   ['NIC receive','The packet arrives; with kernel bypass, the application reads it directly from the card\'s memory','200 to 500 ns'],
   ['Decode','Read the binary message fields','50 to 400 ns'],
   ['Book update','Apply the change to the local book','50 to 200 ns'],
   ['Signal / fair value','Recompute the price model on the new state','100 ns to a few µs'],
   ['Decision','Compare with current quotes and decide: requote, cancel, hit','50 to 300 ns'],
   ['Pre-trade risk','Position, price collar, rate limit checks','50 to 200 ns'],
   ['Encode','Write the order in the venue\'s binary protocol','50 to 200 ns'],
   ['NIC send','Push the packet out','200 to 500 ns']])+
  P(`A well-tuned C++ system lands at roughly 1 to 5 µs. FPGA systems that decode the feed, evaluate a simple rule and send a pre-built order in hardware reach well under a microsecond, sometimes tens of nanoseconds, by starting to send the order before the incoming packet has even finished arriving.`)+
  H('Median versus tail')+P(`The median does not win races; the bad cases lose them. A system with a 2 µs median and a 50 µs 99th percentile is late exactly when markets are busy, which is when it matters most. Most low-latency engineering is about removing <b>jitter</b>: interrupts, cache misses, page faults, context switches, garbage collection, logging.`)+
  H('The rest of the round trip')+UL([`Cross-connect to the exchange gateway: hundreds of nanoseconds.`,`Exchange gateway, sequencer, matching engine, back: from a few to tens of microseconds depending on the venue and load.`,`Market data publication of the result: also microseconds, and not always in the same order as the private execution report.`])+
  P(`Some venues add deliberate delays (<b>speed bumps</b>), such as IEX's 350 µs coil of fibre on incoming orders, to protect resting orders from the fastest traders.`)},

 {id:'lowlat',name:'Low-latency engineering',desc:'Kernel bypass, core pinning, FPGA, clocks',tag:'C++ / FPGA',
  chips:['kernel bypass','ef_vi / Onload','DPDK','isolcpus','busy polling','lock-free','huge pages','PTP','RTS 25'],
  facts:[['Goal','Predictable, short paths with no surprises'],['Network','Kernel bypass, so no system call per packet'],['CPU','Dedicated cores, busy polling, no sleeps'],['Memory','Preallocated, cache-friendly, no allocation in the hot path'],['Clocks','PTP or GPS; EU HFT must stay within 100 µs of UTC']],
  label:'Stack / from the switch to the strategy',steps:['The hot path skips the operating system kernel.','Each thread owns a core and spins; data stays in cache.','Hardware timestamps, synchronised to UTC, record every event.'],draw(){
  const L=[['Strategy (C++)','hot path, no allocation',LIME],['Lock-free queues','single producer, single consumer',LIME],['Kernel bypass','ef_vi, Onload, DPDK',VIOLET],['NIC / FPGA','hardware timestamps',VIOLET],['Layer 1 switch','nanosecond fan-out',WARN],['Time source','GPS, PTP grandmaster',CYAN]];
  L.forEach(([a,b,c],i)=>d.box(90,44+i*66,470,56,a,b,{at:Math.floor(i/2)+(i%2)*.15,size:15,subsize:12,hl:Math.floor(i/2)+.3,c}));
  d.line([[60,72],[60,404]],{at:0,c:LIME,dur:1.5});
  d.pill('Remove every surprise from the path',2.6)},
  deep:P(`Low-latency trading code looks unusual to someone from web or data engineering. The aim is not raw throughput but a short, <b>predictable</b> path, with no event that can stall it for microseconds.`)+
  H('Network')+UL([`<b>Kernel bypass</b>: the application talks directly to the network card (Solarflare/AMD ef_vi or Onload, Mellanox/NVIDIA VMA, DPDK), so receiving a packet costs no system call and no copy. TCP order sessions run on user-space stacks.`,`Hardware <b>timestamps</b> on the card for every packet in and out.`,`<b>FPGA</b> cards for the most latency-critical parts: feed decoding, simple triggers, pre-trade risk checks in line.`])+
  H('CPU and operating system')+UL([`Isolate cores from the scheduler (isolcpus, nohz_full), pin each critical thread to its own core, and route interrupts elsewhere.`,`<b>Busy-poll</b>: threads spin on their input queue instead of sleeping, because waking a thread costs microseconds.`,`Disable power-saving states (C-states, frequency scaling) and often hyper-threading on critical cores.`,`Mind NUMA: the thread, its memory and the network card on the same socket.`])+
  H('Memory and code')+UL([`No heap allocation, no exceptions, no locks and no system calls in the hot path. Memory is preallocated at start-up (pools, ring buffers), often on <b>huge pages</b> to avoid TLB misses.`,`Data laid out for the cache: arrays of structs sized to 64-byte cache lines, hot fields together, padding to avoid false sharing between cores.`,`<b>Lock-free single-producer single-consumer ring buffers</b> between threads (feed thread to strategy thread to order thread).`,`Compile-time polymorphism (templates, CRTP) instead of virtual calls; branch-light code with the likely path first.`,`Logging: binary records written to a ring buffer and formatted by another thread, off the hot path.`,`<b>Cache warming</b>: run the order-sending path regularly with dummy data so it stays in cache, because the real trigger may come only once a minute.`])+
  H('Clocks and timestamps')+P(`Timestamps must be comparable across machines and with the exchange. Firms use GPS receivers or <b>PTP</b> (Precision Time Protocol) grandmaster clocks, and hardware timestamping. In the EU, MiFID II (RTS 25) requires firms doing high-frequency algorithmic trading to keep their business clocks within 100 µs of UTC and to timestamp with 1 µs granularity or finer. Accurate time is also how you measure your own latency and reconstruct what happened during an incident.`)+
  QA(`"Why not just use a faster language or more threads?"`,`Because the problem is variance, not average speed. More threads mean more contention and more cache traffic. A single pinned thread that owns its data and never waits is both faster and more predictable.`)},
]},

{id:'order',name:'Order path',sub:'What an order message contains, how it is checked, matched and confirmed.',rows:[
 {id:'fix',name:'Anatomy of an order message',desc:'FIX NewOrderSingle and the session layer',tag:'FIX 4.4',
  chips:['35=D','35=8','35=F','35=G','ClOrdID','MsgSeqNum','heartbeat','resend','OUCH','iLink 3','ETI'],
  facts:[['Standard','FIX: tag=value pairs separated by SOH (byte 0x01)'],['New order','MsgType 35=D (NewOrderSingle)'],['Response','35=8 (ExecutionReport)'],['Cancel / modify','35=F / 35=G'],['Session','Logon, heartbeats, sequence numbers, resend'],['Fast venues','Native binary protocols: OUCH, iLink 3, ETI']],
  label:'NewOrderSingle / one limit buy (example)',steps:['The header says who sends what to whom, and its sequence number.','The body carries the order: ID, instrument, side, size, type, price, lifetime.','The trailer closes the message with a checksum.'],draw(){
  const L=[['8=FIX.4.4','protocol',0],['35=D','new order single',0],['49=BANKX  56=VENUE','sender, target',0],['34=1207','sequence number',0],['52=20261103-08:14:03.271','sending time (UTC)',0],
   ['11=ORD-77341','client order ID',1],['55=ACME  48=FR0000000001','symbol, ISIN (example)',1],['54=1','side: buy',1],['38=5000','quantity',1],['40=2  44=40.12','limit at 40.12',1],['59=0','time in force: day',1],
   ['10=087','checksum',2]];
  L.forEach(([a,b,at],i)=>{const y=58+i*31;d.text(40,y,a,{size:13.5,mono:1,anchor:'start',fill:at===1?LIME:at===2?WARN:VIOLET,at:at+i*.03});d.text(610,y,b,{size:12.5,anchor:'end',fill:MUTE,at:at+i*.03})});
  d.pill('Every field is a tag number and a value',2.5)},
  deep:P(`<b>FIX</b> (Financial Information eXchange) is the standard language between buy side, brokers and many venues. Each message is a list of <code>tag=value</code> fields separated by the SOH character (byte 0x01, shown as | below). Version 4.2 and 4.4 are the most common in production.`)+
  PRE(`<span class="c">// A limit buy of 5,000 at 40.12, day order (example)</span>
<span class="k">8=FIX.4.4</span>|9=178|<span class="k">35=D</span>|49=BANKX|56=VENUE|34=1207|52=20261103-08:14:03.271|
<span class="k">11=ORD-77341</span>|1=ACC-EQ-12|55=ACME|48=FR0000000001|22=4|54=1|38=5000|40=2|44=40.12|59=0|
60=20261103-08:14:03.270|<span class="k">10=087</span>|`)+
  T(['Tag','Name','Value here','Meaning'],[['8','BeginString','FIX.4.4','Protocol version'],['9','BodyLength','178','Message length, used to frame it'],['35','MsgType','D','NewOrderSingle'],['49 / 56','SenderCompID / TargetCompID','BANKX / VENUE','Who talks to whom on this session'],['34','MsgSeqNum','1207','Sequence number on this session'],['52','SendingTime','UTC','When it was sent'],
   ['11','ClOrdID','ORD-77341','The sender\'s unique ID for this order, used for all follow-ups'],['1','Account','ACC-EQ-12','Account, often the book or the client'],['55 / 48 / 22','Symbol / SecurityID / IDSource','ACME / ISIN / 4','Which instrument (22=4 means ISIN)'],['54','Side','1','1 buy, 2 sell, 5 sell short'],['38','OrderQty','5000','Quantity'],['40','OrdType','2','1 market, 2 limit, 3 stop, 4 stop-limit'],['44','Price','40.12','Limit price'],['59','TimeInForce','0','0 day, 1 GTC, 3 IOC, 4 FOK, 6 GTD'],['60','TransactTime','UTC','When the order was created'],['10','CheckSum','087','Sum of bytes modulo 256']])+
  H('The other messages')+T(['35=','Message','Use'],[['8','ExecutionReport','Every state change: acknowledged, filled, cancelled, rejected'],['F','OrderCancelRequest','Cancel; refers to the order by 41=OrigClOrdID'],['G','OrderCancelReplaceRequest','Modify price or size; new 11, old in 41'],['9','OrderCancelReject','The cancel or replace failed (for example too late: already filled)'],['3 / j','Reject / BusinessMessageReject','Malformed or unsupported message'],['A / 0 / 1 / 2 / 4 / 5','Logon / Heartbeat / TestRequest / ResendRequest / SequenceReset / Logout','Session layer']])+
  H('The session layer')+P(`A FIX session runs over TCP and starts with a Logon. Both sides number every message they send (tag 34). If a side sees a jump in the numbers, it sends a <b>ResendRequest</b> and the other side replays the missing messages, marked 43=Y (PossDupFlag), or skips administrative ones with a SequenceReset-GapFill. <b>Heartbeats</b> at a fixed interval (tag 108, for example 30 s) prove the line is alive; silence triggers a TestRequest, then a disconnect. Sequence numbers usually reset daily. Because orders must never be duplicated or lost, a FIX engine persists every message before sending it.`)+
  H('Native binary protocols')+P(`FIX text is slow to parse. Venues therefore offer native binary protocols for order entry: <b>OUCH</b> at Nasdaq, <b>iLink 3</b> at CME (SBE over TCP), <b>ETI</b> at Eurex, <b>Optiq</b> at Euronext. They carry the same concepts (order ID, side, size, price, TIF) in fixed binary layouts. Clients and brokers still use FIX between each other; latency-sensitive firms use native protocols to the venue.`)},

 {id:'risk-gate',name:'Pre-trade risk gate',desc:'The checks every order passes before leaving',tag:'15c3-5',
  chips:['SEC 15c3-5','MiFID RTS 6','fat finger','price collar','credit','short sale locate','throttle','kill switch'],
  facts:[['US rule','SEC Rule 15c3-5 (Market Access Rule): brokers must check every order before it reaches a venue'],['EU rule','MiFID II RTS 6: pre-trade controls and a kill switch for algorithmic trading'],['Where','In the OMS, the algo, an FPGA risk gateway, and again at the venue'],['Lesson','Knight Capital lost about $440m in 45 minutes in 2012']],
  label:'Gate / one order, eight checks',steps:['Static checks: instrument, size, notional, price collar.','Account checks: credit, position, short-sale locate, restricted list.','Flow checks: message rate, duplicates. One failure and the order is rejected.'],draw(){
  const C=[['Instrument tradable',0],['Max order size',.1],['Max notional',.2],['Price collar ±5%',.3],['Credit / buying power',1],['Position limit',1.1],['Short locate',1.2],['Restricted list',1.3],['Message rate',2],['Duplicate order',2.1]];
  C.forEach(([s,at],i)=>{const x=24+(i%2)*306,y=48+Math.floor(i/2)*72;const bad=i===3;d.box(x,y,296,56,s,null,{at,size:15,hl:at+.25,c:bad?CORAL:LIME});d.text(x+276,y+34,bad?'✕':'✓',{size:18,fill:bad?CORAL:LIME,at:at+.25,anchor:'end'})});
  d.pill('Limit 40.12 vs reference 37.80: +6.1%, rejected',2.4,CORAL)},
  deep:P(`Before any order reaches a venue, it passes a battery of automatic checks. They exist because one bad algorithm can send millions of orders in seconds. In the US, <b>SEC Rule 15c3-5</b> (the Market Access Rule, 2010) makes any broker with market access, including those giving sponsored access to clients, responsible for pre-trade controls under its direct and exclusive control. In the EU, <b>MiFID II RTS 6</b> requires firms trading algorithmically to have pre-trade controls, real-time monitoring, a kill switch, testing of algorithms before deployment, and an annual self-assessment.`)+
  T(['Check','What it compares','Typical behaviour'],[
   ['Instrument and session','Instrument exists, is tradable now, not halted','Reject'],
   ['Maximum order quantity','Order size against a cap per instrument or account','Reject'],
   ['Maximum order value','Quantity × price against a notional cap','Reject'],
   ['Price collar / fat finger','Limit price against a reference (last, mid, close) ± a band','Reject'],
   ['Credit / buying power','Open orders + positions against the client\'s or desk\'s credit','Reject or require approval'],
   ['Position limit','Resulting position against the book\'s limit','Reject'],
   ['Short sale','A locate (borrow) exists; Reg SHO in the US, SSR in the EU','Reject if none'],
   ['Restricted list','Instrument restricted by compliance','Reject or route to compliance'],
   ['Message rate / throttle','Orders per second against a cap per session','Queue or reject'],
   ['Duplicates','Same order repeated within a short time','Reject or alert'],
   ['Cumulative exposure','Total open and executed notional across the day','Alert, then block']])+
  H('Where the checks live')+P(`In a bank, checks are layered: in the client OMS or algo engine (client-level limits), in the smart router or market access gateway (firm-level limits), and often in an FPGA or kernel-bypass risk gateway when latency matters, adding well under a microsecond. Venues apply their own price bands and order limits, and clearing brokers can set limits at the venue for the accounts they clear. Every layer can trigger a <b>kill switch</b> that cancels all open orders and blocks new ones.`)+
  WARNBOX(`<b>Knight Capital, 1 August 2012.</b> A deployment left old code active on one of eight servers. When a flag was reused, that server started sending child orders for an obsolete strategy in a loop. In about 45 minutes the firm built billions of dollars of unwanted positions and lost about $440m, which ended it as an independent company. The lessons are still quoted in every RTS 6 assessment: test deployments, monitor cumulative exposure, and have a kill switch someone is allowed to press.`)},

 {id:'exchange-inside',name:'Inside the exchange',desc:'Gateway, sequencer, matching engine, publishers',tag:'VENUE',
  chips:['gateway','sequencer','matching engine','partition','market data publisher','drop copy','STP','speed bump'],
  facts:[['Gateway','Session, validation, throttling'],['Sequencer','Puts all events in one deterministic order'],['Matching','One thread per partition of instruments'],['Outputs','Private execution reports, public market data, drop copies, clearing feed'],['Determinism','Replaying the input sequence reproduces the same output']],
  label:'Venue / one order through the exchange',steps:['The gateway checks the session and the order, then forwards it.','A sequencer timestamps and orders all inputs; the matching engine processes them one by one.','Results fan out: your execution report, the public feed, drop copy, clearing.'],draw(){
  d.box(24,60,150,70,'Gateway 1',null,{at:0,size:15});d.box(24,150,150,70,'Gateway 2',null,{at:.05,size:15});d.box(24,240,150,70,'Gateway N',null,{at:.1,size:15});
  d.box(236,150,150,70,'Sequencer','total order',{at:1,hl:1.1,c:VIOLET});[95,185,275].forEach((y,i)=>d.arrow([[174,y],[236,185]],{at:1+i*.05,c:MUTE}));
  d.box(236,260,150,80,'Matching','partition A–M',{at:1.3,hl:1.4});d.arrow([[311,220],[311,260]],{at:1.3,c:LIME});
  const O=[['Exec reports','private',60],['Market data','public',150],['Drop copy','risk, broker',240],['Clearing','to the CCP',330]];
  O.forEach(([a,b,y],i)=>{d.box(476,y,150,70,a,b,{at:2+i*.07,size:15,hl:2.3,c:i===1?VIOLET:LIME});d.arrow([[386,300],[476,y+35]],{at:2+i*.07,c:MUTE})});
  d.pill('One input order, one deterministic output',2.6)},
  deep:P(`A modern exchange is a small, highly engineered distributed system. Its job is to be fast, fair and above all <b>deterministic</b>: the same inputs in the same order must always give the same trades.`)+
  OL([`<b>Order entry gateways.</b> Each member connects through one or more sessions (FIX or native binary). The gateway checks the session, the message format, the member's permissions, throttles (messages per second), and often price bands and order size. It assigns an exchange order ID or forwards to the core.`,`<b>Sequencer.</b> All inputs from all gateways are put in one total order and timestamped. This is the moment that defines time priority. The sequenced stream is also persisted and replicated to a backup site, so the backup can replay it and be ready to take over.`,`<b>Matching engine.</b> Instruments are split into partitions; each partition is processed by one thread in strict sequence, so no locks are needed. For each input it applies the rules (match, rest, cancel, trigger stops, start auctions) and emits results.`,`<b>Outputs.</b> Private execution reports go back to the member's session. Public market data goes to the multicast publishers. Drop copies go to designated risk systems or clearing brokers. Trades go to the CCP for clearing and to the trade publication service.`])+
  H('Details that matter to a trader')+UL([`<b>Race between private and public.</b> Your own fill and the public trade message come from different paths. Sometimes the public feed is faster, so a strategy can see a trade before learning that it was its own.`,`<b>Self-trade prevention (STP).</b> If two orders with the same firm or account tag would match, the engine cancels the resting one, the incoming one, or both, depending on the instruction.`,`<b>Order-to-trade ratio.</b> Venues charge or limit members whose messages far exceed their trades (an obligation under MiFID II).`,`<b>Market maker protections.</b> Option venues let market makers set a limit on how many fills they can get in a short window, after which all their quotes are pulled (mass quote protection).`,`<b>Speed bumps and batching.</b> Some venues delay incoming orders or match in frequent batches to reduce the value of pure speed.`])},

  d.arrow([[400,240],[476,345]],{at:2.2,c:WARN});
  d.pill('Every arrow is an ExecutionReport (35=8)',2.6)},
  deep:P(`Every change in an order's life produces an <b>ExecutionReport</b> (35=8). Two fields carry the meaning: <b>ExecType</b> (150) says what just happened, <b>OrdStatus</b> (39) says where the order now stands.`)+
  EX('A buy of 1,000 at 40.12 that fills in two pieces (example)',T(['#','Direction','Message','Key fields'],[
   ['1','Client → venue','NewOrderSingle 35=D','11=A1, 38=1000, 40=2, 44=40.12'],
   ['2','Venue → client','ExecutionReport: New','150=0, 39=0, 37=EX99 (venue order ID), 14=0, 151=1000'],
   ['3','Venue → client','ExecutionReport: Trade','150=F, 39=1, 31=40.12, 32=300, 14=300, 151=700, 6=40.12, 17=T5531, 851=1 (added liquidity)'],
   ['4','Client → venue','OrderCancelReplaceRequest 35=G','11=A2, 41=A1, 44=40.13 (raise the price)'],
   ['5','Venue → client','ExecutionReport: Replaced','150=5, 39=1, 11=A2, 44=40.13, 151=700'],
   ['6','Venue → client','ExecutionReport: Trade','150=F, 39=2, 31=40.13, 32=700, 14=1000, 151=0, 6=40.127']]))+
  P(`Average price (tag 6) = (300 × 40.12 + 700 × 40.13) / 1,000 = 40.127. Tag 17 (ExecID) identifies each fill uniquely and is the key used downstream for booking and reconciliation. Tag 851 (LastLiquidityInd) says whether the fill added or removed liquidity, which determines the fee or rebate.`)+
  H('The cases that cause bugs')+UL([`<b>Too late to cancel.</b> A cancel crosses a fill on the wire. The venue answers with an OrderCancelReject (35=9, 102=0 too late). The strategy must treat the order as filled.`,`<b>Replace loses priority.</b> Most venues keep time priority only when the size is reduced; a price change or a size increase sends the order to the back of the queue.`,`<b>Unsolicited cancels.</b> The venue can cancel orders itself: end of day, halt, self-trade prevention, a member's disconnection with cancel-on-disconnect enabled.`,`<b>Trade busts and corrections.</b> After an erroneous trade, the venue can cancel (bust) or correct a fill hours later (150=H or G). Positions must be adjusted.`,`<b>Duplicate fills after a resend.</b> After a reconnection, messages can be replayed with PossDupFlag. Using ExecID to deduplicate is mandatory.`])+
  P(`An order management system is, at its core, this state machine implemented carefully for millions of orders a day, with every transition persisted and timestamped.`)},

  deep:T(['Path','How it works','Capacity','Typical users and products','Bank earns'],[
   ['DMA (direct market access)','Client\'s OMS sends orders through the broker\'s gateway and pre-trade checks to the venue. The client decides everything.','Agency','Hedge funds, prop traders; equities, futures','Low commission per share or contract'],
   ['Sponsored access','Like DMA but the client\'s orders go to the venue under the broker\'s membership without passing through the broker\'s systems; the broker\'s risk checks still apply (often in FPGA at the venue).','Agency','HFT firms','Fees, clearing'],
   ['Algorithmic execution','Client gives the parent order and a strategy (VWAP, IS, close). The bank\'s algo slices it and routes the children.','Agency','Asset managers; equities, futures, FX','Commission in bp'],
   ['High touch / sales trading','A sales trader works the order: finds natural blocks, uses algos, may offer a risk price.','Agency or principal','Large or sensitive orders','Commission or spread'],

 {id:'internalisation',name:'Central risk book',desc:'Netting client flows before touching the market',tag:'CRB',
  chips:['internalisation','netting','central risk book','factor hedge','SI'],
  facts:[['Idea','Opposite client flows offset each other inside the bank'],['Benefit','No market impact, no fees, less information leakage'],['Residual','Hedged with futures, ETFs or baskets, or worked in the market'],['Rules','Fair prices, client consent and disclosure; SI obligations in the EU']],
  label:'Netting / three clients, one residual (example)',steps:['Client A buys 200k, client B sells 150k, client C sells 30k.','The central risk book crosses what offsets: 180k never touches the market.','Only the 20k residual goes out, or is hedged with a factor hedge.'],draw(){
  d.box(24,60,170,64,'Client A','buys 200k',{at:0,size:15});d.box(24,170,170,64,'Client B','sells 150k',{at:.1,size:15});d.box(24,280,170,64,'Client C','sells 30k',{at:.2,size:15});
  d.box(250,150,170,104,'Central risk book','net +20k',{at:1,hl:1.2,c:VIOLET});
  [92,202,312].forEach((y,i)=>d.arrow([[194,y],[250,202]],{at:1+i*.05,c:i?LIME:VIOLET}));
  d.count(335,300,180000,1.4,{size:24,unit:' crossed',fill:LIME});
  d.box(476,150,150,104,'Market','buy 20k',{at:2,hl:2.2});d.arrow([[420,202],[476,202]],{at:2,c:LIME});
  d.tag(551,290,'or hedge with futures',{at:2.3,w:170,c:WARN});
  d.pill('The cheapest trade is the one you never send',2.5)},
  deep:P(`A large bank sees thousands of client orders a day in the same stocks, bonds or currencies, in opposite directions. Sending all of them to the market would pay the spread and impact twice. A <b>central risk book</b> (CRB) collects the flows and the risk of several desks and nets them, and sends only the residual to the market.`)+
  EX('Worked example (example)',P(`Client A buys 200,000 shares, client B sells 150,000, client C sells 30,000. The bank crosses 180,000 internally at a fair price (for example the mid or within the spread), and only 20,000 needs to be bought in the market. At 10 bp of saved impact and spread on €7.2m of crossed notional (180,000 × €40), the clients save about €7,200 and the bank saves fees and information leakage.`))+
  H('How it works in practice')+UL([`Flows from agency algos, principal risk trades, ETF market making and derivatives hedging arrive in the CRB as risk.`,`The CRB manages <b>risk</b>, not individual orders: it uses a factor model to see that being long a bank stock and short a bank index are mostly offsetting.`,`It hedges the residual cheaply with futures, ETFs or baskets, and unwinds idiosyncratic risk over time.`,`Prices given to clients come from the CRB's view of fair value and its inventory: if it is already long, it will bid lower and offer tighter.`])+
  H('Rules')+UL([`For agency orders, crossing must give the client a price at least as good as the market (best execution), and the client must have agreed to it.`,`In the EU, a firm that internalises client orders on a frequent and systematic basis above thresholds is a <b>systematic internaliser</b> with quoting and reporting obligations.`,`Information barriers: a CRB must not use knowledge of a client's pending order to trade ahead of it. Front-running is market abuse.`])},

 {id:'algos',name:'Execution algorithms',desc:'VWAP, TWAP, POV, implementation shortfall',tag:'ALGO',
  chips:['VWAP','TWAP','POV','IS','Almgren-Chriss','close','dark seeker','parent / child'],
  facts:[['Layers','Scheduler (how much, when) → placement (how) → router (where)'],['VWAP','Follow the expected volume curve of the day'],['POV','Trade a fixed share of market volume'],['IS','Balance impact against timing risk (Almgren-Chriss)'],['Inputs','Volume profile, volatility, spread, impact model, client limits']],
  label:'VWAP / slicing a parent order along the volume curve (example)',steps:['The algo forecasts the day\'s volume profile: heavy at the open and close.','It schedules child quantities to follow that profile.','Each slice is placed passively or aggressively, then routed.'],draw(){
  d.axes(70,60,520,300,{x:'trading day: 9:00 to 17:30',y:'volume share',at:0});
  const v=[9,6,4.5,3.8,3.4,3.2,3.1,3.3,3.6,4.2,5,6.5,12];const W=520/v.length;
  v.forEach((h,i)=>{d.bar(70+i*W+4,360-h*20,W-8,h*20,{up:1,at:.2+i*.04,c:MUTE,op:.45})});
  v.forEach((h,i)=>{d.bar(70+i*W+10,360-h*20*.6,W-20,h*20*.6,{up:1,at:1+i*.06,c:LIME,op:.9})});
  d.text(560,92,'close',{size:12,mono:1,fill:SOFT,anchor:'end',at:.6});d.text(110,92,'open',{size:12,mono:1,fill:SOFT,at:.3});
  d.tag(325,110,'child orders follow the forecast',{at:1.4});d.tag(325,404,'placement: passive first, cross when behind',{at:2,c:VIOLET});
  d.pill('The algo decides how much, how, and where',2.5)},
  deep:P(`An execution algorithm turns a <b>parent order</b> (buy 300,000 ACME today, limit 41.00) into hundreds of <b>child orders</b>. Its architecture has three layers.`)+
  OL([`<b>Scheduler (macro):</b> how much to trade in each time bucket. It follows a target trajectory from the strategy and the client's constraints (start and end time, maximum participation, price limit).`,`<b>Placement (micro):</b> how to trade each slice: post passively at the bid, join the queue, peg to mid in dark pools, or cross the spread when the algo falls behind schedule. It uses short-term signals (imbalance, queue sizes) to time the crossing.`,`<b>Router:</b> where to send each child (see <a href="#sor">Smart order routing</a>).`])+
  T(['Strategy','Target','Good for','Risk'],[
   ['VWAP','Trade in line with the forecast volume curve; benchmark is the day\'s VWAP','Non-urgent orders, low tracking error to VWAP','Ignores price; predictable'],
   ['TWAP','Equal slices over time','Illiquid instruments, simple schedules','Predictable, may trade at bad moments'],
   ['POV / participation','A fixed share (for example 10%) of the volume that trades','Following liquidity as it comes','Unknown end time'],
   ['Implementation shortfall (arrival)','Minimise expected cost plus risk against the arrival price','Orders with alpha that decays','Front-loaded impact'],
   ['Close / MOC','Target the closing price, trade mainly in the auction','Index funds','Auction imbalance risk'],
   ['Liquidity seeking','Find blocks in dark pools and conditional venues','Large orders in mid caps','Information leakage']])+
  H('Almgren-Chriss in one paragraph')+P(`To sell X shares over time T, trading fast reduces exposure to price moves (risk) but increases temporary impact (cost). With linear temporary impact η per unit rate, permanent impact γ, volatility σ and risk aversion λ, the optimal holdings follow:`)+
  EQ('x(t) = X · sinh(κ (T − t)) / sinh(κ T),   κ = √(λ σ² / η)')+
  P(`When λ = 0 (no risk aversion), κ → 0 and the schedule is a straight line: TWAP. The more risk-averse, the more front-loaded. The model gives an <b>efficient frontier</b> of expected cost against variance, and the trader chooses a point on it.`)+
  H('The volume profile')+P(`VWAP needs a forecast of how volume is distributed over the day: a U shape in equities, with a spike at the close, and specific shapes on index rebalance days, option expiries and macro releases. It is estimated from historical intraday volumes per stock and adjusted in real time if the day is busier than expected.`)+
  QA(`"Your VWAP algo beat VWAP by 5 bp. Is it a good algo?"`,`Not necessarily. VWAP includes your own trades, so a large order drags the benchmark with it. Compare against arrival price as well, and check what the price did after you finished.`)},

 {id:'sor',name:'Smart order routing',desc:'Choosing venues for every child order',tag:'SOR',
  chips:['consolidated book','fees','fill probability','latency','toxicity','dark pinging','ISO','spray'],
  facts:[['Input','A consolidated view of all venues\' books'],['Score','Price, size, fees, fill odds, latency, toxicity'],['Timing','Send to all venues so orders arrive at the same moment'],['Dark first','Ping mid-point pools before showing on lit venues'],['Constraint','Best execution policy; Reg NMS order protection in the US']],
  label:'Router / one child order of 6,000 (example)',steps:['The router builds a consolidated book from every venue.','It scores each venue and splits the order.','It times the sends so all slices land together, before quotes vanish.'],draw(){
  d.box(24,190,140,80,'Child','buy 6,000',{at:0,hl:.1});d.box(205,190,140,80,'SOR','score & split',{at:1,hl:1.1,c:VIOLET});d.arrow([[164,230],[205,230]],{at:.8,c:MUTE});
  const V=[['Primary','2,500 @ 40.12',60],['MTF 1','1,500 @ 40.12',150],['MTF 2','800 @ 40.12',240],['Dark mid','1,200 @ 40.115',330]];
  V.forEach(([a,b,y],i)=>{d.box(430,y,196,66,a,b,{at:1.3+i*.06,size:15,submono:1,subsize:12});d.arrow([[345,230],[430,y+33]],{at:2+i*.02,c:LIME});d.packet([[345,230],[430,y+33]],2.1,{dur:.7,once:1})});
  d.text(390,428,'arrival spread < 5 µs',{size:12,mono:1,fill:LIME,at:2.2});
  d.pill('Hit everyone at once, before they can react',2.5)},
  deep:P(`A <b>smart order router</b> (SOR) receives a child order and decides how to split it across venues, and in what order. Its inputs are a consolidated view of every venue's book (from direct feeds) and statistics on each venue.`)+
  T(['Factor','Why it matters'],[
   ['Displayed price and size','The obvious part: go where the best price is'],
   ['Fees and rebates','Taking on a maker-taker venue costs more than on an inverted venue'],
   ['Fill probability','Displayed size is not always fillable; historical fill rates per venue and size'],
   ['Hidden liquidity','Some venues reliably hold icebergs and mid-point liquidity'],
   ['Latency to each venue','Determines when to send to each so that orders arrive together'],
   ['Toxicity / markouts','Venues where fills are followed by adverse moves'],
   ['Information leakage','Venues where showing size attracts predatory trading']])+
  H('Timing and spraying')+P(`If the router sends to venue A, then B, then C, market makers who see the fill on A cancel their quotes on B and C before the orders arrive. Routers therefore send to all venues at once, adding small delays so that orders <b>arrive</b> at the same microsecond despite different network distances. This is called latency equalisation; a well-known early implementation was RBC's THOR.`)+
  H('Dark first')+P(`For a passive or patient order, a router often pings mid-point dark pools first with IOC orders (sometimes with minimum quantities, to avoid small predatory orders), then posts the rest on lit venues. Some pools accept <b>conditional orders</b> that only become firm when a match is likely.`)+
  H('US specifics')+P(`Under Reg NMS, a router that takes liquidity at a price must also take any better displayed prices on other exchanges, or mark the order as an <b>ISO</b> (intermarket sweep order) and send orders to clear those better prices at the same time.`)},

 {id:'rfq',name:'RFQ trading',desc:'How dealers compete for a bond or swap trade',tag:'RFQ',
  chips:['RFQ','auto-quoter','hit ratio','cover','winner\'s curse','all-to-all','portfolio trading'],
  facts:[['Mechanics','Client asks 3 to 5 dealers; they quote within seconds; client trades on one'],['Dealer side','An auto-quoter prices most RFQs automatically'],['Feedback','Winner learns it won; losers may learn the cover'],['Risk','Winning means you were the most aggressive: winner\'s curse'],['After','The winner hedges: futures, swaps, other bonds']],
  label:'RFQ / a client sells €10m of a bond (example)',steps:['The client sends an RFQ to five dealers on a platform.','Each dealer\'s auto-quoter returns a bid within seconds.','The client hits the best bid. The winner holds the bond and hedges.'],draw(){
  d.box(24,200,140,80,'Client','sells €10m',{at:0,hl:.1});
  const Q=[['Dealer 1','98.42',60],['Dealer 2','98.45',140],['Dealer 3','98.40',220],['Dealer 4','98.44',300],['Dealer 5','no quote',380]];
  Q.forEach(([a,b,y],i)=>{const best=i===1;d.box(410,y-24,216,58,a+'  '+b,null,{at:1+i*.07,size:15,hl:best?2:null,c:LIME});d.arrow([[164,240],[410,y+5]],{at:.2+i*.04,c:MUTE,head:7})});
  d.tag(285,110,'request: 2 to 15 s to answer',{at:.4,c:VIOLET});d.tag(285,420,'cover = 98.44',{at:2.2,c:WARN});
  d.pill('Dealer 2 wins at 98.45 and now owns the risk',2.4)},
  deep:P(`Most bonds, swaps and many ETF and options blocks are traded by <b>request for quote</b> on platforms such as Tradeweb, Bloomberg and MarketAxess. The client chooses which dealers to ask (often 3 to 5), the dealers quote within a short window, and the client trades on the best price or not at all.`)+
  H('Inside the dealer: the auto-quoter')+OL([`An RFQ arrives with instrument, side, size and client.`,`The pricer computes a <b>reference mid</b>: from the bank's curves and the most recent trades and quotes for liquid bonds, from comparable bonds and credit curves for illiquid ones.`,`It adds a <b>spread</b> that depends on size, liquidity, volatility and the client's tier, and a <b>skew</b> from current inventory: if the desk is already long this bond, its bid is lower.`,`It estimates the <b>probability of winning</b> at different prices from history (competition, the number of dealers asked, the client's past behaviour) and chooses the price that maximises expected profit.`,`If the request is unusual (too large, too illiquid, stale data), it is sent to a human trader instead.`])+
  EQ('max over p:  P(win | p) × (expected value of the position at p − hedge and holding costs)')+
  H('What the dealer learns afterwards')+P(`The winner learns it traded. On many platforms, the winner is told the <b>cover</b> (the second-best price), and losers learn whether they were close. Dealers track <b>hit ratios</b> per client and per instrument to tune their pricing.`)+
  H('Winner\'s curse')+P(`The dealer who wins is the one who priced most aggressively, so winning is itself information that the price was generous. If the client is also asking because it knows something, the dealer's markouts will be negative. This is why spreads are wider for clients with a history of informed trading.`)+
  H('After the win')+P(`The winning desk holds the bond. It hedges its rate risk immediately with government bond futures or swaps, and its credit risk with CDS or indices if large, then tries to sell the bond to another client over the following days, sometimes by axing it (advertising interest) on the platforms. Portfolio trading, where a client asks for one price on a list of hundreds of bonds, and all-to-all trading, where buy-side firms can respond to RFQs too, are growing parts of credit markets.`)},

 {id:'fx-stream',name:'FX streaming and last look',desc:'How a bank prices currencies to clients',tag:'FX',
  chips:['ECN','single-dealer platform','aggregator','tiering','skew','last look','hold time','CLS'],
  facts:[['Market','OTC; no single exchange'],['Venues','EBS, LSEG FX Matching (D2D); ECNs; banks\' own platforms'],['Pricing','Streamed by size and client tier, skewed by inventory'],['Last look','A short window to reject a trade if the price moved'],['Code','FX Global Code sets the rules of conduct']],
  label:'Streaming / one EUR/USD price, many clients (example)',steps:['The pricing engine computes a mid from interdealer and ECN prices.','It streams bands by size and client tier, skewed by inventory.','When a client clicks, last look checks the price is still valid, then fills.'],draw(){
  d.box(24,60,170,70,'Market data','EBS, ECNs',{at:0,size:15});d.box(240,60,170,70,'Pricing engine','mid 1.08450',{at:.2,hl:.4,c:VIOLET});d.arrow([[194,95],[240,95]],{at:.2,c:MUTE});
  const T2=[['Tier 1, 1m','1.08448 / 1.08452'],['Tier 2, 5m','1.08444 / 1.08456'],['Tier 3, 10m','1.08438 / 1.08462']];
  T2.forEach(([a,b],i)=>{d.box(240,170+i*70,386,56,a+':  '+b,null,{at:1+i*.1,size:14,mono:1,hl:1.3,c:LIME})});
  d.box(456,60,170,70,'Inventory','long 40m EUR',{at:1,size:15,hl:1.2,c:WARN});d.arrow([[456,95],[410,95]],{at:1,c:WARN});
  d.box(24,380,250,46,'Client clicks: buy 5m',null,{at:2,size:15});d.box(376,380,250,46,'Last look: OK, filled',null,{at:2.2,size:15,hl:2.4});d.arrow([[274,403],[376,403]],{at:2.1,c:LIME});
  d.pill('Spread by size and tier, skewed by inventory',2.6)},
  deep:P(`FX is the largest market in the world and almost entirely OTC. Interdealer trading happens on EBS and LSEG FX Matching (central limit order books), dealers and non-bank market makers stream prices to <b>ECNs</b> and through <b>single-dealer platforms</b>, and clients use <b>aggregators</b> that display the best stream from many providers.`)+
  H('The pricing engine')+OL([`<b>Mid.</b> Built from the best interdealer and ECN prices, filtered for stale or off-market quotes, sometimes with a short-term signal (for example the futures market).`,`<b>Spread.</b> Depends on size (larger tickets get wider spreads), on the client tier (clients with toxic flow get wider spreads), on volatility and on the time of day.`,`<b>Skew.</b> If the bank is long EUR, it moves both bid and ask down a little, to attract buyers and discourage sellers. This is the same idea as Avellaneda-Stoikov (see <a href="#mm-model">Market-making models</a>).`,`<b>Hedging.</b> Internalise as much as possible; when inventory passes a threshold, hedge on the interdealer market.`])+
  H('Last look')+P(`When a client trades on a streamed price, many liquidity providers keep a short window (a few milliseconds) to check that the price is still valid and accept or reject the trade. It protects them from being picked off on stale prices by faster clients. The <b>FX Global Code</b> (principle 17) requires last look to be used only as a risk control for price and validity checks, disclosed to clients, and not to trade on the information from the client's request during the window. Clients measure reject rates and hold times per provider and route away from those with bad numbers.`)+
  H('Settlement')+P(`Spot settles on T+2 (T+1 for USD/CAD). Most major currency trades settle through <b>CLS</b>, which pays both currencies simultaneously (payment versus payment) to remove the risk that one side pays and the other defaults, a risk named after Herstatt Bank's failure in 1974.`)},

 {id:'tca',name:'Best execution and TCA',desc:'Measuring what execution really cost',tag:'TCA',
  chips:['arrival price','implementation shortfall','VWAP slippage','spread cost','impact','timing','opportunity cost'],
  facts:[['Benchmark','Arrival (decision) price is the reference'],['Shortfall','Paper portfolio minus real portfolio'],['Pieces','Delay, spread, impact, timing, opportunity, fees'],['Rule','MiFID II: take all sufficient steps to obtain the best result, and monitor it']],
  label:'Shortfall / buying 300,000 shares (example)',steps:['The PM decided at 40.00. The order reached the broker at 40.013.','270,000 shares filled at an average of 40.062: spread, impact and timing.','30,000 were not filled; the stock closed at 40.204: opportunity cost.'],draw(){
  const S=[['delay','+3.0',3,0],['spread','+2.5',2.5,1],['impact','+6.0',6,1.1],['timing','+2.5',2.5,1.2],['fees','+0.5',.5,1.3],['opportunity','+5.1',5.1,2]];
  let base=360;const k=14;S.forEach(([n,v,h,at],i)=>{const x=60+i*92;d.bar(x,base-h*k,64,h*k,{up:1,at,c:i===5?WARN:i===0?VIOLET:LIME,op:.8});d.text(x+32,base-h*k-10,v,{size:13,mono:1,fill:SOFT,at});d.text(x+32,base+22,n,{size:12,mono:1,fill:MUTE,at});base-=h*k});
  d.text(24,52,'bp, cumulative (example)',{size:12,mono:1,fill:MUTE,anchor:'start',at:0});
  d.count(560,118,19.6,2.2,{size:26,unit:' bp',dec:1});d.text(560,142,'total shortfall',{size:12,mono:1,fill:MUTE,at:2.2});
  d.pill('Every basis point has a cause and an owner',2.6)},
  deep:P(`Transaction cost analysis (TCA) measures how much worse the actual execution was than an ideal benchmark, and why. The reference measure is <b>implementation shortfall</b> (Perold, 1988): the difference between a paper portfolio traded instantly at the decision price and the real one.`)+
  EX('Worked example (example)',P(`The PM decides to buy 300,000 shares at 40.00, a paper notional of €12m, so 1 bp = €1,200. Every cost below is expressed in bp of that €12m.`)+UL([`<b>Delay.</b> The order reaches the broker when the price is 40.0133. On the 270,000 shares that will be filled, that is 270,000 × 0.0133 ≈ €3,600 = <b>3.0 bp</b>.`,`<b>Execution.</b> The 270,000 shares fill at an average of 40.0622, which is 0.0489 above arrival: €13,200 = 11.0 bp. The broker's TCA splits it into <b>spread 2.5 bp</b>, <b>impact 6.0 bp</b> and <b>timing 2.5 bp</b> (that split is model-based).`,`<b>Fees.</b> €600 = <b>0.5 bp</b>.`,`<b>Opportunity.</b> 30,000 shares are not filled because of the limit, and the stock closes at 40.204: 30,000 × 0.204 = €6,120 = <b>5.1 bp</b>.`,`<b>Total shortfall</b>: 3.0 + 11.0 + 0.5 + 5.1 = <b>19.6 bp</b>, about €23,500.`]))+
  T(['Component','Cause','Owner'],[['Delay','Time between decision and the order reaching the market','PM, trading desk, OMS'],['Spread','Crossing the bid-ask','Algo placement, venue choice'],['Impact','The price moving because of your own trading','Schedule, size, information leakage'],['Timing','Price moving for other reasons during execution','Risk, part luck'],['Fees and taxes','Commissions, venue fees, stamp duty or financial transaction tax','Broker choice, routing'],['Opportunity','Shares not executed, and the price move after','Limit price, urgency']])+
  H('Benchmarks')+UL([`<b>Arrival price</b>: the most honest for urgent or alpha-driven orders.`,`<b>Interval VWAP</b>: easy to hit and widely reported, but it rewards passivity and includes your own trades.`,`<b>Close</b>: for index funds.`,`<b>Pre-trade estimate</b>: actual cost against what the impact model predicted. This tests the model, and it is how impact models are recalibrated.`])+
  H('Best execution')+P(`MiFID II requires firms executing client orders to take all sufficient steps to obtain the best possible result, considering price, costs, speed, likelihood of execution and settlement, size and nature. Firms must have a written execution policy, monitor its effectiveness and be able to demonstrate to a client that an order was executed according to it. TCA reports are how buy-side firms supervise their brokers and decide who gets their order flow next quarter.`)},
]},

 {id:'curves',name:'Curves',desc:'Discounting and projection, bootstrapped from swaps',tag:'RATES',

  label:'Curve / bootstrapped from market quotes (example)',steps:['Liquid instruments give prices at a set of maturities.','Bootstrapping solves discount factors one maturity at a time.','Interpolation fills in between. Risk is measured against each input.'],draw(){

  deep:P(`Every rates product and most other derivatives need two things: a way to <b>discount</b> future cash flows to today, and a way to <b>project</b> future floating fixings. Both come from curves built from liquid market quotes.`)+
  H('Multi-curve')+P(`Before 2008, banks used one curve built from LIBOR swaps for both. The crisis showed that LIBOR contained bank credit risk and that collateralised trades should be discounted at the rate paid on collateral, the overnight rate. Since then: <b>discount</b> with the OIS curve (SOFR for USD, €STR for EUR, SONIA for GBP), and <b>project</b> each index tenor (EURIBOR 3M, EURIBOR 6M) from its own curve. USD LIBOR ended in June 2023; USD swaps now reference SOFR directly. EURIBOR is still published and used.`)+
  H('Bootstrapping')+OL([`Choose the instruments: overnight and short deposits, then futures or FRAs for the short end, then swaps out to 50 years.`,`Sort by maturity. For the first instrument, solve the discount factor that reprices it exactly.`,`For each next instrument, its value depends on discount factors already solved plus one new one; solve that one (by Newton's method or in closed form).`,`Choose an <b>interpolation</b> for dates in between: log-linear on discount factors (piecewise flat forwards), monotone convex, or splines. The choice changes forward rates and hedges.`])+
  EQ('swap par rate S(T) = (P(0,T₀) − P(0,T)) / Σ τᵢ P(0,Tᵢ)   (single curve, for intuition)')+
  H('Risk on a curve')+P(`Because the curve is built from a set of quotes, the natural risk measure is the sensitivity of a portfolio to each <b>input quote</b>: bump the 5-year swap rate by 1 bp, rebuild the curve, revalue. That gives a <b>DV01 ladder</b> by bucket, which traders hedge with the same instruments. The Jacobian between input quotes and curve points converts between risk representations.`)+

 {id:'vol',name:'Volatility surfaces',desc:'Implied volatility by strike and expiry',tag:'VOL',

  deep:P(`Black-Scholes assumes one constant volatility. The market disagrees: options with different strikes and expiries trade at different <b>implied volatilities</b>. The surface of implied vol by strike and expiry is the main input to every option pricing model, and building it well is a core desk quant job.`)+
  H('Shapes')+UL([`<b>Equity indices</b>: a downward <b>skew</b>; out-of-the-money puts are expensive because crashes happen and investors buy protection.`,`<b>FX</b>: a <b>smile</b>, often asymmetric towards one currency (risk reversals).`,`<b>Rates</b>: swaption smiles in normal (bp) vol, quoted per expiry and swap tenor, a cube rather than a surface.`,`<b>Term structure</b>: vol levels by expiry, usually upward in calm markets and inverted in stress.`])+
  H('Fitting')+P(`Quotes are sparse and noisy, so desks fit a parametric form per expiry and interpolate in time. The most common:`)+
  EQ('SVI:  w(k) = a + b ( ρ (k − m) + √((k − m)² + σ²) ),   w = σ_imp² × T,  k = log(K / F)')+
  P(`SVI (Gatheral) is used widely in equities. <b>SABR</b> (Hagan and co-authors, 2002) models the forward and its volatility as correlated processes and gives a closed-form approximation of the smile; it is the market standard for swaptions and common in FX. FX desks build smiles from three quotes per expiry: ATM, the 25-delta risk reversal (call vol minus put vol) and the 25-delta butterfly, plus 10-delta wings.`)+
  H('No-arbitrage')+UL([`<b>Calendar</b>: total implied variance w = σ² T must not decrease with expiry at a fixed moneyness.`,`<b>Butterfly</b>: call prices must be convex in strike, which means the implied density is positive.`,`Violations would let anyone build a riskless profit, and they break local volatility models, which need a smooth surface.`])+
  H('Dynamics')+P(`How the smile moves when spot moves matters for hedging. <b>Sticky strike</b>: each strike keeps its vol. <b>Sticky delta</b> (or sticky moneyness): the smile moves with spot. The truth is in between and changes by market; the choice changes your delta and therefore your hedge.`)},

   ['Theta Θ','∂V/∂t','Daily time decay; the cost of long gamma','Not hedged, earned or paid'],
