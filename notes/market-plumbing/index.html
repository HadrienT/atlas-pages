<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Market Plumbing Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: the Atlas three-column console (views rail, component list, animated diagram + deep dive), plus a long-form reading mode. Single dark theme, as Atlas. */
:root{color-scheme:dark;--bg:#060a0b;--panel:#080d0b;--card:#0a100d;--node:#0b120e;--ink:#eef2ee;--soft:#b9c1ba;--mute:#8d968f;--dim:#5b655e;--line:#1f2a24;--line2:#2c3a30;--lime:#c6f135;--olive:#1d2a12;--violet:#8c7dff;--warn:#f2b84b;--coral:#ff7b6b;--cyan:#5ad1d8;
--display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 700px at 62% 62%,#0d1610 0%,transparent 70%),radial-gradient(800px 500px at 10% 100%,#0b130e 0%,transparent 70%),var(--bg);background-color:var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--display);font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:var(--lime)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column;gap:22px;padding-block:22px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1720px;margin:0 auto}
@media(min-width:900px){.app{padding-left:max(44px,env(safe-area-inset-left,0px));padding-right:max(44px,env(safe-area-inset-right,0px))}}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.2em;font-size:11px;color:var(--mute)}
.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{color:var(--ink);font-weight:500;font-size:13px}
.home{color:var(--lime);text-decoration:none;padding:4px 10px;margin-left:-10px;border-radius:8px;transition:background .2s}.home:hover{background:var(--olive)}
.nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.modes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.modes button{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.modes button[aria-pressed=true]{border-color:var(--lime);color:var(--lime);background:var(--olive)}
.modes button:hover{color:var(--ink)}
.head h1{margin:0;font-size:clamp(32px,4vw,52px);font-weight:500;letter-spacing:-.02em;line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.head h1 em{font-style:normal;color:var(--lime);margin-left:.35em;text-shadow:0 0 28px #c6f13555}
.head p{margin:8px 0 0;font-size:clamp(15px,1.4vw,19px);color:var(--soft);min-height:1.4em}
.cols{display:grid;grid-template-columns:230px minmax(0,.92fr) minmax(0,1.08fr);gap:0 34px;flex:1;align-items:start}
.side{padding-right:30px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px;align-self:stretch;min-width:0}
.tabs{display:flex;flex-direction:column;gap:6px}
.tab{display:flex;align-items:center;gap:14px;height:42px;padding:0 14px;border-radius:12px;border:1.5px solid transparent;color:var(--mute);font-size:15px;white-space:nowrap;transition:color .2s,background .2s,border-color .2s}
.tab b{font:500 11px var(--mono);color:var(--lime);opacity:.85;min-width:16px}
.tab:hover{color:var(--ink);background:#0e1611}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--lime);background:linear-gradient(90deg,#26361499,#14200f66);box-shadow:0 0 22px #c6f13522}
.mid,.right{min-width:0;display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column;gap:8px}
.row{position:relative;display:block;width:100%;border-radius:13px;border:1px solid var(--line2);background:var(--card);padding:11px 16px 11px 50px;transition:border-color .2s,background .2s,box-shadow .2s}
.row:hover{border-color:#47604c}
.row i{position:absolute;left:18px;top:15px;font:400 11px var(--mono);color:var(--mute)}
.row h3{margin:0;font-size:17px;font-weight:500;padding-right:96px}
.row p{margin:2px 0 0;font-size:14px;color:var(--mute)}
.row u{position:absolute;right:14px;top:14px;font:400 10px var(--mono);color:var(--mute);text-decoration:none;letter-spacing:.06em;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row[aria-expanded=true]{border:1.5px solid var(--lime);background:linear-gradient(90deg,#2a3b1680,#17230f40);box-shadow:0 0 24px #c6f13520}
.row[aria-expanded=true] p{color:var(--soft)}
.more{display:grid;grid-template-columns:minmax(84px,auto) minmax(0,1fr);gap:4px 14px;margin-top:10px;font-size:13px}
.more dt{font:400 10px/1.9 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--mute)}
.more dd{margin:0;color:var(--soft);overflow-wrap:anywhere}
code{font:400 .9em var(--mono);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px;grid-column:1/-1;margin-top:4px}
.chips span{font:400 11px var(--mono);padding:2px 7px;border-radius:6px;background:#141c15;color:var(--soft)}
.flag{grid-column:1/-1;margin-top:6px;display:flex;gap:8px;font-size:13px;color:var(--warn);line-height:1.4}
.flag::before{content:"▲";font-size:9px;line-height:18px}
.panel{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
.scroll{overflow-x:auto}
#svg{display:block;width:100%;height:auto}
.is-map .mid{display:none}.is-map .right{grid-column:2/4}
.is-map #svg{min-width:760px;max-height:max(440px,calc(100vh - 310px))}
.cap{font-size:16px;color:var(--soft);min-height:2.7em;margin:0;line-height:1.35}
.cap b{font:400 12px var(--mono);color:var(--lime);margin-right:8px}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{min-width:30px;height:28px;padding:0 8px;border-radius:7px;border:1px solid var(--line2);font:400 11px var(--mono);color:var(--mute);text-align:center}
.dot:hover{color:var(--ink);border-color:#47604c}
.dot[aria-current=true]{background:var(--olive);border-color:var(--lime);color:var(--lime)}
/* Deep dive: the long explanation under each diagram, and the reading mode. */
.deep{display:flex;flex-direction:column;gap:12px;font-size:15.5px;line-height:1.62;color:var(--soft);border-top:1px solid var(--line);padding-top:18px;margin-top:6px;max-width:78ch}
.is-map .deep{max-width:90ch}
.deep h2{margin:0;font-size:26px;font-weight:500;color:var(--ink);letter-spacing:-.01em;text-wrap:balance;line-height:1.2}
.deep .lede{font-size:17px;color:var(--ink);opacity:.9}
.deep h4{margin:12px 0 0;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.16em;color:var(--lime)}
.deep p{margin:0}
.deep b,.deep strong{color:var(--ink);font-weight:500}
.deep ul,.deep ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:5px}
.deep li::marker{color:var(--dim)}
.deep .tw{overflow-x:auto;border:1px solid var(--line2);border-radius:12px;background:var(--card)}
.deep table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.45;font-variant-numeric:tabular-nums}
.deep th{font:400 10px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--mute);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:bottom}
.deep td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--soft);min-width:90px}
.deep tr:last-child td{border-bottom:0}
.deep td:first-child{color:var(--ink)}
.deep pre{margin:0;font:400 12.5px/1.6 var(--mono);color:var(--ink);background:var(--node);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;overflow-x:auto;white-space:pre}
.deep pre .k{color:var(--lime)}.deep pre .c{color:var(--mute)}
.deep .eq{font:400 13.5px/1.7 var(--mono);color:var(--ink);background:var(--node);border:1px solid var(--line2);border-radius:10px;padding:10px 14px;overflow-x:auto;white-space:nowrap}
.deep .ex{border:1px solid #3a4a22;background:#0f170b;border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.deep .ex h5{margin:0;font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.16em;color:var(--lime)}
.deep .warnbox{border:1px solid #4a3a1a;background:#16110a;border-radius:12px;padding:12px 16px;color:var(--soft)}
.deep .warnbox b{color:var(--warn)}
.deep .qa{border-left:2px solid var(--violet);padding:2px 0 2px 14px}
.deep .qa b{color:var(--violet)}
/* Reading mode */
.doc{display:grid;grid-template-columns:240px minmax(0,1fr);gap:0 44px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 40px);overflow:auto;display:flex;flex-direction:column;gap:2px;padding-right:12px;border-right:1px solid var(--line)}
.toc a{color:var(--mute);text-decoration:none;font-size:13.5px;padding:3px 0;line-height:1.3}
.toc a:hover{color:var(--ink)}
.toc a.v{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--lime);margin-top:12px}
.docbody{min-width:0;display:flex;flex-direction:column;gap:30px}
.docview{display:flex;flex-direction:column;gap:26px}
.docview>header{border-bottom:1px solid var(--line2);padding-bottom:12px}
.docview>header h2{margin:4px 0 0;font-size:clamp(26px,3vw,38px);font-weight:500;letter-spacing:-.02em}
.docview>header p{margin:4px 0 0;color:var(--soft);font-size:17px}
.docitem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:22px 34px;align-items:start;padding-bottom:26px;border-bottom:1px solid var(--line)}
.docitem .deep{border-top:0;padding-top:0;margin:0;grid-row:1/3}
.docitem figure{margin:0;position:sticky;top:20px;display:flex;flex-direction:column;gap:8px}
.docitem figure svg{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.docitem figure figcaption{font:400 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.docitem .more{margin:0}
footer{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ctl{display:flex;gap:6px}
.ctl button{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.ctl button:hover{color:var(--ink);border-color:#47604c}
#play{border-color:var(--lime);color:var(--lime);background:var(--olive)}
.track{height:3px;background:var(--line);position:relative}
#prog{position:absolute;left:0;top:0;bottom:0;background:var(--lime);box-shadow:0 0 12px #c6f13588;width:0}
svg text{font-family:var(--display);fill:var(--ink)}
svg .m{font-family:var(--mono)}
svg .go{cursor:pointer}
svg .go:hover>rect:first-child{stroke:var(--lime)}
svg .go:focus-visible{outline:none}svg .go:focus-visible>rect:first-child{stroke:var(--lime);stroke-width:2}
@media(max-width:1180px){
 .cols{grid-template-columns:minmax(0,1fr);gap:18px}
 .side{border:0;padding:0}.tabs{flex-direction:row;overflow-x:auto;padding-bottom:4px}.tab{height:40px;flex:none}
 .is-map .right{grid-column:auto}
 .right{order:2}.mid{order:3}
 .doc{grid-template-columns:minmax(0,1fr)}
 .toc{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:0 0 12px;flex-direction:row;flex-wrap:wrap;gap:4px 14px}
 .toc a:not(.v){display:none}.toc a.v{margin-top:0}
 .docitem{grid-template-columns:minmax(0,1fr)}
 .docitem .deep{grid-row:auto}
 .docitem figure{position:static;max-width:520px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

META.mapDeep=`<h2>How to read this guide</h2>
<p class="lede">A trade looks like one click. Behind it sit about fifteen systems, five organisations and a dozen rules. This guide follows that trade step by step, then opens each step in its own chapter.</p>
${P(`The <b>Trade map</b> above follows one agency equity order. Press <b>Play tour</b> to walk through every chapter in order, or click any box. Each chapter has an animated diagram with numbered steps, a list of key facts, and a long explanation below the diagram. <b>Read as one document</b>, at the top, shows the whole guide as a single long text with every diagram.`,
`The chapters follow the order in which the questions come up: who trades with whom, how a bank is organised, how risk is limited and approved, how an order book works, what colocation and latency mean, what an order message contains, how an order gets executed, which model does what, what happens after the trade, how risk and P&L are run every day, and finally four complete workflows and what a quant should master.`)}
${H('The five zones of the map')}
${T(['Zone','Who','What happens there'],[
 ['Client','Asset manager, pension fund, hedge fund, corporate treasurer','The decision to trade, the order in an OMS (order management system), and the receipt of shares in custody.'],
 ['Front office','Sales, traders, e-trading, quants','Pricing, risk taking, execution algorithms, routing, booking. This is where revenue is made.'],
 ['Control','Market risk, credit risk, product control, compliance','Limits, pre-trade checks, independent P&L and valuation. These teams are independent of the front office and report to the CRO or the CFO.'],
 ['Venue','Exchange, MTF, dark pool','Order entry, matching, market data. Banks and market makers rent racks in the same data centre to save microseconds.'],
 ['Post-trade','CCP, CSD, custodians, regulators, operations','Clearing, settlement, reporting, reconciliation. Most of a bank\'s headcount works here, and most failures show up here.']])}
${H('Three facts that organise everything else')}
${OL([`<b>Agency or principal.</b> Either the bank works the client\'s order and takes no market risk (it earns a commission), or it takes the other side and holds the risk (it earns a spread). Almost every workflow forks on this choice.`,
`<b>Front office takes risk, control measures it.</b> A trader inside the mandate and the limits trades without asking anyone. Validation happens through automatic pre-trade checks and through daily independent risk and P&L, not through a second desk approving each trade. Only exceptions need a human yes.`,
`<b>Execution and settlement are separate worlds.</b> Matching takes microseconds. Clearing and settlement take one or two days. In between, the CCP stands between buyer and seller and holds margin.`])}
${WARNBOX(`<b>About the numbers.</b> Prices, sizes, latencies and limits marked (example) are invented but realistic orders of magnitude. Regulations are cited with their usual names (MiFID II, MiFIR, EMIR, Reg NMS, SEC 15c3-5, Basel / FRTB). Their detail changes often, so check the current text before quoting a threshold in an interview.`)}`;

 {id:'books',name:'Books and internal trades',desc:'How risk moves between desks inside the bank',tag:'TRANSFER',
  chips:['internal trade','mirror trade','transfer price','FTP','XVA charge'],
  facts:[['Principle','Each type of risk is managed by the desk that specialises in it'],['Mechanism','Internal trades between books, at a transfer price'],['Examples','Options desk passes delta to spot desk; CVA goes to the XVA desk; funding to Treasury'],['Net effect','Zero for the bank, but P&L lands with the right owner']],
  label:'Internal trades / one client option, four owners (example)',steps:['A client buys a 1-year EUR/USD option from the FX options desk.','The options desk passes its delta to the spot desk with an internal trade.','The XVA desk charges for counterparty risk; Treasury charges for funding.'],draw(){
  d.box(24,200,140,70,'Client','buys option',{at:0});d.box(250,200,160,70,'FX options','keeps vega',{at:0,hl:.3});
  d.arrow([[164,235],[250,235]],{at:.2,c:LIME});
  d.box(470,70,156,70,'FX spot','takes delta',{at:1,hl:1.2});d.arrow([[410,215],[440,215],[440,105],[470,105]],{at:1,c:LIME});d.tag(548,165,'internal trade',{at:1.1});
  d.box(470,300,156,70,'XVA desk','CVA, FVA',{at:2,hl:2.2,c:VIOLET});d.arrow([[410,255],[440,255],[440,335],[470,335]],{at:2,c:VIOLET});
  d.box(250,360,160,62,'Treasury','funding rate',{at:2.2,hl:2.4,c:WARN});d.arrow([[330,270],[330,360]],{at:2.2,c:WARN});
  d.pill('Each risk ends where it is cheapest to manage',2.7)},
  deep:P(`Banks organise risk by specialisation. When a client trade creates several risks, internal trades move each one to the desk that manages it best. Each internal trade has two legs, one in each book, so the bank's total position is unchanged, but each desk's P&L now reflects only the risk it chose to hold.`)+
  EX('Worked example: one client option (example)',OL([`A corporate buys a 1-year EUR/USD call for €50m notional from the FX options desk. The desk sells it at a vol of 8.2% against a mid of 8.0%: that difference is the trading margin.`,`The option has a delta of 45%, so the desk is short €22.5m of EUR delta. Instead of trading spot itself, it books an internal spot trade with the FX spot desk at the current mid. The spot desk now holds the delta and decides whether to hedge in the market or net it against other flow.`,`The client has no collateral agreement, so the bank is exposed to its default. The XVA desk computes a CVA of, say, €40k, charges it to the options desk at inception (the client price includes it), and hedges it with CDS or indices.`,`The trade needs funding (premium is paid later, hedges need margin). Treasury charges a funds transfer price (FTP) per unit of funding used.`,`The options desk ends up holding only what it is good at: vega, gamma and smile.`]))+
  H('Why the transfer price matters')+P(`The internal price decides which desk books the profit. If it is off-market, one desk is subsidised by another. Product control checks that internal trades are at market. Some banks run a <b>central risk book</b> that concentrates delta from many desks, which is where internalisation happens (see <a href="#internalisation">Central risk book</a>).`)+
  H('Back-to-back across legal entities')+P(`Large banks have several legal entities (for example a UK broker-dealer, an EU bank, a US entity). A client may face the local entity for regulatory reasons, while the risk is managed in another one through a back-to-back internal trade. This is called <b>remote booking</b>, and regulators look closely at it.`)},

  T(['Type of firm','Who takes risk','How risk is limited','Who validates'],[
   ['Bank trading desk','Traders within a client-facing mandate','VaR, sensitivities, stop-loss, notional, capital, Volcker metrics','Market risk, product control, model validation, regulators'],

   ['Systematic fund','Models, monitored by researchers','Portfolio optimiser with risk model and constraints, capacity limits','Risk and execution teams']])+
  H('The pod model in detail')+P(`In a multi-manager fund, each pod receives capital (say $500m) and is expected to make money with low correlation to the market and to other pods. The central team hedges unwanted factor exposure across pods, which lets each PM focus on stock-specific views. Drawdown rules are strict and automatic: after a first loss threshold capital is cut, after a second the pod is closed. Pay is a share of the pod's own P&L. Quants in these firms build risk models, alpha signals, and tools that tell PMs their factor exposures in real time.`)+
  H('The HFT model in detail')+P(`A prop HFT firm has no clients, so most of the bank's governance (sales, KYC on clients, client credit lines) disappears. What remains is automated: every order passes a risk server that checks position, notional, price collars and message rates in microseconds, and every strategy has a daily loss limit after which it is switched off. Because they have direct or sponsored market access, they are still subject to market access rules through their clearing broker.`)},

{id:'limits',name:'Limits & approval',sub:'Mandates, limits, and who has to say yes.',rows:[
 {id:'appetite',name:'From risk appetite to a trader',desc:'A top-down cascade of limits',tag:'CASCADE',
  chips:['risk appetite','mandate','limit hierarchy','utilisation','diversification'],
  facts:[['Top','Board approves the firm\'s risk appetite'],['Middle','Risk committee allocates limits to businesses and desks'],['Bottom','Each trader has a mandate letter and book limits'],['Answer','Inside the mandate and limits, a trader trades freely, with no trade-by-trade approval']],
  label:'Cascade / VaR limits at each level (example)',steps:['The board sets the firm\'s appetite: how much it may lose.','Risk allocates it down to businesses, desks and books.','A trader inside the mandate and limits needs no approval per trade.'],draw(){
  const L=[['Board risk appetite','firm VaR 150m',0],['Global markets','VaR 80m',.4],['Rates','VaR 25m',.8],['EUR swaps desk','VaR 6m · DV01 2m/bp',1.2],['Book: 2y-10y','VaR 2m · DV01 0.8m/bp',1.6],['Trader','mandate letter',2]];
  L.forEach(([a,b,at],i)=>{const w=600-i*70,x=325-w/2;d.box(x,44+i*66,w,54,a,b,{at,size:15,subsize:12,hl:at+.2,c:i>3?LIME:VIOLET})});
  d.pill('Inside the box, the trader decides alone',2.4)},
  deep:P(`This answers the central question: <b>do desks have a risk quota, or does someone validate every trade?</b> Desks have quotas, called <b>limits</b>, inside a written <b>mandate</b>. Inside them, traders trade without asking. A separate function measures the risk continuously and checks the P&L every day. Approval before the trade is only needed for exceptions.`)+
  H('The cascade')+OL([`<b>Risk appetite.</b> The board approves, every year, how much the bank may lose under normal and stressed conditions, in terms of earnings, capital and liquidity.`,`<b>Business allocation.</b> The CRO and the risk committee split that appetite into limits for each business (global markets, treasury, banking book).`,`<b>Desk limits.</b> Market risk proposes limits for each desk: VaR, stress, sensitivities, stop-loss. The head of the business and risk agree them. These are reviewed at least yearly.`,`<b>Book and trader limits.</b> The desk head allocates within the desk. Each trader receives a <b>mandate letter</b>.`])+
  H('What a mandate letter says')+UL([`Products allowed (for example EUR and GBP swaps up to 30 years, bond futures, but no options).`,`Currencies, maturities, issuers or underlyings allowed.`,`Limits on each book: VaR, DV01 by bucket, vega, notional, concentration, stop-loss.`,`Which instruments may be used to hedge.`,`Which counterparties and venues may be used.`,`Booking and escalation rules.`])+
  H('Why sub-limits add up to more than the parent')+P(`VaR is not additive: two desks with VaR of 10 each, whose risks are partly offsetting, may have a combined VaR of 14. So the sum of sub-limits is usually larger than the parent limit, by an amount that reflects expected diversification. If correlations change and diversification falls, the parent can breach while every child is inside its limit. Risk managers watch for this.`)+
  H('Utilisation')+P(`Each limit has a utilisation (risk divided by limit). Most banks warn at 80% to 90% and treat 100% as a breach. A desk that sits at 30% all year will see its limit cut, because unused limits still consume the bank's appetite and capital planning.`)+
  QA(`"How does a trader know how much risk they can take?"`,`From the mandate and limits, monitored live by the risk system. Hard pre-trade limits stop an order automatically; soft limits produce an alert and an escalation.`)},

  H('Hard and soft limits')+P(`A <b>hard</b> limit is enforced by the system before the order is sent: the order is rejected. Fat-finger limits, maximum order size, credit lines and price collars are hard. A <b>soft</b> limit is monitored: when it breaks, people are alerted and must act. VaR and stop-loss are soft, because they cannot be computed exactly for every order in real time and because a breach can come from the market moving, not from a trade.`)+

   ['Client onboarding','First trade with a client, or a new product type for them','KYC/AML team, compliance, legal (ISDA and CSA signed for derivatives)','No; done in advance'],
   ['Suitability / appropriateness','Retail or non-professional clients, complex products','Sales supervision, compliance','Partly'],

 {id:'breach',name:'When a limit breaks',desc:'Detection, escalation, decision, record',tag:'BREACH',
  chips:['active breach','passive breach','temporary increase','escalation matrix'],
  facts:[['Active','Caused by a new trade'],['Passive','Caused by the market moving or a model change'],['Response','Reduce the risk, or obtain a temporary limit increase'],['Record','Every breach is logged and reported to the risk committee']],

  d.box(24,60,180,70,'Detect','risk system',{at:0,hl:.2,c:CORAL});d.box(235,60,180,70,'Notify','trader, desk, risk',{at:.4});d.box(446,60,180,70,'Explain','why it happened',{at:1});

  d.arrow([[536,130],[536,165],[215,165],[215,200]],{at:1.2,c:MUTE});d.line([[435,165],[435,200]],{at:1.2,c:MUTE});
  const M=[['< 10% over','desk head + risk manager'],['10–25% over','business head + head of market risk'],['> 25% over','CRO or risk committee']];
  M.forEach(([a,b],i)=>{d.text(60,320+i*36,a,{size:14,mono:1,anchor:'start',fill:WARN,at:2+i*.1});d.text(220,320+i*36,b,{size:14,anchor:'start',fill:SOFT,at:2+i*.1})});

  deep:P(`A limit breach is not a disaster: markets move, and limits are set tight enough that they will occasionally be crossed. What matters is that every breach is seen, explained and decided, quickly and on the record.`)+
  OL([`<b>Detection.</b> The risk system flags it, intraday for sensitivities, at end of day for VaR and stress. An <b>active</b> breach comes from a new trade; a <b>passive</b> one from the market moving, a volatility spike raising VaR, or a model or data change.`,`<b>Notification.</b> The trader, the desk head and the desk's market risk manager are alerted automatically.`,`<b>Explanation.</b> The trader states the cause and the plan, usually the same day.`,`<b>Decision.</b> Either the position is reduced back inside the limit within a deadline, or a <b>temporary limit increase</b> is requested, with a size and an expiry date. The approver depends on how large the excess is, following an escalation matrix.`,`<b>Record and follow-up.</b> Breaches are logged, counted per desk and reported to the risk committee. Repeated active breaches affect the trader\'s assessment and pay, and can lead to a mandate being cut.`])+

 {id:'capital',name:'Capital and balance sheet',desc:'Why each desk is charged for the risk it holds',tag:'CAPITAL',
  chips:['RWA','CET1','leverage ratio','FRTB','IMA','PLA test','cost of capital'],
  facts:[['Constraint','Risk consumes regulatory capital and balance sheet'],['Measure','Return on capital per desk, against a hurdle'],['FRTB','Desks must pass backtesting and P&L attribution tests to use internal models'],['Fallback','A failing desk moves to the standardised approach, which costs more capital']],
  label:'Capital / what a desk is charged (example)',steps:['Risk positions create risk-weighted assets (RWA).','RWA times the capital ratio gives capital consumed.','The desk must earn more than the cost of that capital.'],draw(){
  d.box(24,60,180,80,'Positions','market, credit, CVA',{at:0});d.arrow([[204,100],[235,100]],{at:.3,c:MUTE});

  d.box(446,60,180,80,'Capital','× 13% = €260m',{at:1,hl:1.2,c:VIOLET});
  d.box(24,220,290,90,'Cost of capital','× 12% = €31m a year',{at:2,c:WARN,hl:2.2});d.box(336,220,290,90,'Desk revenue','€45m: above hurdle',{at:2.2,hl:2.4});
  d.text(325,360,'Return on capital = (45 − costs) / 260',{size:15,mono:1,fill:SOFT,at:2.3});
  d.pill('Capital is the scarcest resource on a trading floor',2.6)},
  deep:P(`Limits cap how much a desk can lose. Capital decides how much it costs to hold the risk at all. Regulators require banks to hold equity against the risks they carry, and that equity has a cost, so every desk is charged for the capital it consumes.`)+
  H('From risk to capital')+UL([`<b>Market risk capital</b> comes from the trading book: under Basel 2.5, VaR and stressed VaR multiplied by a factor; under FRTB, expected shortfall at 97.5% with liquidity horizons from 10 to 120 days, plus charges for risks that cannot be modelled (NMRF) and default risk.`,`<b>Counterparty credit risk capital</b> comes from derivatives exposure to clients (SA-CCR or internal models).`,`<b>CVA capital</b> covers the risk that the CVA itself changes.`,`These are expressed as <b>risk-weighted assets</b> (RWA). The bank must hold a CET1 ratio of RWA (for example 13%) plus buffers.`,`Separately, the <b>leverage ratio</b> caps total exposure regardless of risk, which makes low-risk, high-volume businesses such as repo expensive.`])+
  H('FRTB makes the desk a regulatory unit')+P(`Under FRTB, a bank that wants to use internal models must define its trading desks formally, and each desk must be approved separately. Every desk must pass <b>backtesting</b> (how often actual losses exceed the model) and the <b>P&L attribution test</b>, which compares the P&L predicted by the risk model with the P&L from the front-office pricing models, using a Spearman correlation and a Kolmogorov-Smirnov statistic. A desk that fails falls back to the standardised approach, which usually needs much more capital. So the alignment of front-office models with risk models is worth real money, and it is quant work. Implementation dates differ by jurisdiction and have been postponed several times.`)+
  H('How this reaches the desk')+UL([`Each desk has a <b>capital budget</b> and a <b>balance sheet budget</b> for the year.`,`It is measured on <b>return on equity</b> or RoRWA against a hurdle rate, often 10% to 15%.`,`Trades that consume a lot of capital (long-dated uncollateralised derivatives with weak counterparties, for example) are priced with a <b>KVA</b> (capital valuation adjustment), charged to the client.`,`At quarter ends, banks often shrink balance sheet because some ratios are measured on those dates, which shows up in repo and FX swap markets.`])},
]});

{id:'micro',name:'Microstructure',sub:'The order book, depth, liquidity and what a trade costs.',rows:[
 {id:'lob',name:'The limit order book',desc:'Queues at each price, matched by price then time',tag:'CLOB',

  const lv=[['100.04',[600,900,400],'a'],['100.03',[500,800],'a'],['100.02',[300,500,400],'a'],['100.01',[700,300],'b'],['100.00',[400,900,600],'b'],['99.99',[1000,500],'b']];

  d.text(600,190,'asks',{size:13,mono:1,fill:VIOLET,anchor:'end',at:0});d.text(600,300,'bids',{size:13,mono:1,fill:LIME,anchor:'end',at:0});
  d.line([[40,230],[610,230]],{at:.5,c:'#4a5a4e',dash:1});d.text(40,246,'spread = 1 tick = 0.01',{size:12,mono:1,anchor:'start',fill:MUTE,at:.5});
  d.tag(360,214,'time priority: oldest first',{at:1.2});

  d.text(525,128,'fills 300 + 500 + 200',{size:12,mono:1,fill:CORAL,at:2.3});
  d.pill('Price first, then time',2.5)},
  deep:P(`The central limit order book (CLOB) is the heart of exchange trading. It is a list of resting <b>limit orders</b>: buy orders (bids) at or below some price, sell orders (asks or offers) at or above. The highest bid and the lowest ask form the <b>top of book</b>, or touch.`)+
  H('Vocabulary')+T(['Term','Meaning'],[
   ['Mid','(bid + ask) / 2'],['Spread','ask − bid, often in ticks or basis points of the mid'],['Tick size','Minimum price increment, set by the venue or regulation (in the EU it depends on price and liquidity band)'],
   ['Lot / round lot','Minimum quantity increment'],['Level','All orders at one price'],['Depth','Quantity available at or near the touch'],['Queue position','How much quantity is ahead of your order at its level'],
   ['Marketable order','An order whose price crosses the opposite best: it trades on arrival (aggressive, taker)'],['Passive order','An order that rests in the book (maker)']])+
  H('Matching rules')+P(`An incoming order that can trade is matched against the best opposite price first, and within that price against the oldest order first (<b>price-time priority</b>, or FIFO). Each match generates a trade at the <b>resting</b> order's price. Any remainder either rests in the book (a limit order) or is cancelled (IOC, market). Some futures markets use <b>pro-rata</b> allocation, where an incoming order is split across resting orders in proportion to their size, sometimes with a priority bonus for the order that set the price first. Pro-rata rewards size over speed and leads to over-posting.`)+
  H('Why queue position is worth money')+P(`In a large-tick stock, where the spread is almost always one tick, the queue at each level is long. An order at the front of the queue gets filled before the price moves; one at the back gets filled mostly when the level is about to be consumed, which is when the price is about to move against it. Market makers spend heavily on latency to be early in the queue when a new level forms.`)+
  H('Microprice')+P(`The mid ignores the sizes. If the bid has 5,000 and the ask has 500, the next trade is more likely to move the price up. A simple size-weighted estimate is:`)+
  EQ('microprice ≈ (P_bid × Q_ask + P_ask × Q_bid) / (Q_bid + Q_ask)')+P(`With bid 100.00 × 5,000 and ask 100.01 × 500: (100.00 × 500 + 100.01 × 5,000) / 5,500 = 100.0091. Stoikov (2018) gives a more rigorous version computed from the dynamics of imbalance. Imbalance is one of the strongest short-horizon signals in microstructure.`)+
  H('Market data levels')+UL([`<b>L1</b>: best bid and ask with sizes, and last trade.`,`<b>L2 / market by price (MBP)</b>: aggregated quantity at each of the top N levels.`,`<b>L3 / market by order (MBO)</b>: every individual order with its own ID, so you can rebuild the queues and track your position in them. Examples: Nasdaq TotalView-ITCH, CME MBO, Eurex EOBI.`])},

   ['Limit','Buy at P or below, sell at P or above. Rests if not marketable.','Control the price; earn the spread as a maker.'],
   ['Market','Trade immediately against the book. Venues add price collars to avoid sweeping an empty book.','Certainty of execution; costs the spread plus impact.'],

 {id:'depth',name:'Depth and walking the book',desc:'What a large order really pays',tag:'SLIPPAGE',
  chips:['depth','sweep','VWAP of fill','slippage','resilience'],
  facts:[['Depth','Quantity available near the touch'],['Sweep','A large marketable order consumes several levels'],['Slippage','Average fill price versus mid at arrival'],['Lesson','Visible depth is only part of the liquidity, and it can vanish']],
  label:'Sweep / buy 4,000 at market (example)',steps:['The ask side shows four levels.','A buy of 4,000 consumes 800, then 1,200, then 2,000 of the third level.','Average price 100.0330 against a mid of 100.0150: 1.8 bp of cost.'],draw(){
  const rows=[['100.05',3000,'a'],['100.04',2500,'a'],['100.03',1200,'a'],['100.02',800,'a'],['100.01',1500,'b'],['100.00',2200,'b']];

  const ys=[52+3*52,52+2*52,52+1*52];[[800,ys[0],1],[1200,ys[1],1.25],[2000,ys[2],1.5]].forEach(([q,y,at])=>{d.bar(134,y,330*q/3200,46,{at,c:CORAL,op:.55})});
  d.text(475,52+3*52+29,'800 @ 100.02',{size:13,mono:1,anchor:'start',fill:CORAL,at:1});d.text(475,52+2*52+29,'1,200 @ 100.03',{size:13,mono:1,anchor:'start',fill:CORAL,at:1.25});d.text(475,52+52+29,'2,000 @ 100.04',{size:13,mono:1,anchor:'start',fill:CORAL,at:1.5});
  d.text(325,394,'avg 100.0330 · mid 100.0150 · cost 1.8 bp',{size:15,mono:1,fill:INK,at:2});
  d.pill('Depth sets the cost of immediacy',2.4)},
  deep:P(`Depth is how much you can trade before the price moves against you. The simplest way to feel it is to sweep the book by hand.`)+
  EX('Worked example: sweeping the ask (example)',T(['Level','Price','Size shown','Taken'],[['Ask 1','100.02','800','800'],['Ask 2','100.03','1,200','1,200'],['Ask 3','100.04','2,500','2,000'],['Ask 4','100.05','3,000','0']])+
   P(`Cost = 800 × 100.02 + 1,200 × 100.03 + 2,000 × 100.04 = 80,016 + 120,036 + 200,080 = 400,132. Average price = 400,132 / 4,000 = <b>100.0330</b>. The mid before the order was (100.01 + 100.02) / 2 = 100.015. Cost against mid = 0.018 per share, or 0.018 / 100.015 ≈ <b>1.8 bp</b>, about €72 on a €400k order. Half of the spread (0.5 bp) is unavoidable for any taker; the rest is the price of size.`)+
   P(`After the sweep, the best ask is 100.04 with 500 left, the spread has widened to 3 ticks, and other participants will update their quotes. Market makers will usually refill within milliseconds, often at slightly higher prices, because a 4,000-share buy is information.`))+
  H('Why visible depth lies')+UL([`<b>Hidden liquidity</b>: icebergs, hidden orders and dark pools hold more than the book shows.`,`<b>Fleeting liquidity</b>: market makers cancel quotes in microseconds when they see a large order arriving on another venue. A router that sends to five venues one after the other finds the later ones already gone. Hence latency-equalised routing (see <a href="#sor">Smart order routing</a>).`,`<b>Resilience</b>: how fast the book refills after a sweep. A deep but slow book is worse for a large order than a thinner, fast-refilling one.`])+
  H('Measures of depth used in practice')+UL([`Quantity within X bp of the mid on each side (for example within 10 bp).`,`Cost to trade a given notional (for example the bp cost of a €1m sweep), computed continuously from the book.`,`Average daily volume (ADV), and an order's size as a percentage of ADV, the most common rule-of-thumb input to impact models.`])},

 {id:'liquidity',name:'Measuring liquidity and impact',desc:'Spreads, Kyle\'s lambda and the square-root law',tag:'IMPACT',
