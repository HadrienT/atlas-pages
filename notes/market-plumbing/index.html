  facts:[['Fair value','Best estimate of the price right now, better than the mid'],['Reservation price','Fair value shifted against inventory'],['Spread','Covers adverse selection, risk and fees'],['Hedger','Lays off inventory past a threshold'],['Reference','Avellaneda and Stoikov (2008); Guéant, Lehalle, Fernandez-Tapia (2013)']],
  label:'Quoting / inventory moves the quotes (example)',steps:['Quotes sit around a fair value, not just around the mid.','A long inventory shifts both quotes down, to sell more and buy less.','Past a threshold, the auto-hedger trades out, and quotes recentre.'],draw(){
  d.line([[325,60],[325,410]],{c:MUTE,dash:1});d.text(325,52,'fair value',{size:12,mono:1,fill:MUTE,at:0});
  d.box(120,90,180,60,'Bid 99.98',null,{at:0,size:15});d.box(350,90,180,60,'Ask 100.02',null,{at:0,size:15});d.text(325,180,'flat inventory',{size:13,mono:1,fill:SOFT,at:0});
  d.box(90,220,180,60,'Bid 99.96',null,{at:1,size:15,hl:1.2,c:LIME});d.box(320,220,180,60,'Ask 100.00',null,{at:1,size:15,hl:1.2,c:LIME});d.text(325,310,'long 50k: reservation price shifts down',{size:13,mono:1,fill:LIME,at:1.1});
  d.box(205,340,240,60,'Hedge 40k with future',null,{at:2,size:15,hl:2.2,c:WARN});
  d.pill('Price around fair value, skew for inventory',2.6)},
  deep:P(`A market maker earns the spread and loses on adverse selection and inventory risk. Its models do three things: estimate <b>fair value</b>, place <b>quotes</b> around it given inventory, and <b>hedge</b> when inventory gets too large.`)+
  H('1. Fair value')+P(`The mid is a poor estimate when sizes are lopsided or when a related market has just moved. Fair value models combine the microprice (see <a href="#lob">order book</a>), order flow imbalance, recent trades, and leading instruments (the future for a stock or an ETF, the interdealer market for FX, the ETF's basket of components). For an ETF, fair value is computed from its basket in real time; for an option, from the underlying's fair value and the vol surface.`)+
  H('2. Quotes: Avellaneda-Stoikov')+P(`With inventory q, risk aversion γ, volatility σ and time horizon T − t, the market maker quotes around a <b>reservation price</b>, not the mid:`)+
  EQ('r = s − q γ σ² (T − t)')+EQ('δ_bid + δ_ask = γ σ² (T − t) + (2 / γ) ln(1 + γ / k)')+
  P(`Here k describes how fast the probability of being filled falls with distance from the mid. A long inventory (q > 0) shifts the reservation price down: the market maker bids lower and offers lower, so it is more likely to sell. The total spread widens with volatility and risk aversion. Guéant, Lehalle and Fernandez-Tapia (2013) solved the version with inventory limits, which is closer to practice.`)+
  H('3. The auto-hedger')+P(`Instead of waiting for clients to take inventory back, the desk hedges past a threshold: an equity market maker hedges with index futures, an FX desk on the interdealer market, an options desk delta-hedges with the underlying. Hedge thresholds and sizes are parameters chosen by trading off spread and impact paid on the hedge against the risk of holding.`)+
  H('What real systems add')+UL([`Quote <b>sizes</b> that depend on queue position and on confidence in fair value.`,`Separate parameters per client segment or venue, from markout analysis.`,`Risk limits on inventory, on loss per minute, and on message rates; automatic widening around news and auctions.`,`Cross-asset risk: quoting hundreds of ETFs or options on a shared risk book, hedged at the factor level.`])},

 {id:'alpha',name:'Signals and alpha research',desc:'From an idea to a live strategy, and what goes wrong',tag:'RESEARCH',
  chips:['features','target horizon','walk-forward','purged CV','look-ahead','overfitting','capacity','decay','costs'],
  facts:[['Target','Future return over a horizon (ms to months)'],['Features','Order book, flow, price, fundamentals, alternative data'],['Validation','Out-of-sample, walk-forward, purged cross-validation'],['Killers','Look-ahead, survivorship, overfitting, ignored costs'],['Live','Paper trading, small capital, then scale within capacity']],
  label:'Research / from idea to live',steps:['Data and features are built point-in-time, with no future information.','The model is validated out of sample, with realistic costs.','It goes live small, is monitored for decay, and scaled within capacity.'],draw(){
  const S=[['Data','point-in-time',0],['Features','imbalance, flow',.15],['Model','ridge, GBDT',.3],['Backtest','costs, latency',1],['Paper','shadow trading',1.15],['Live','small, then scale',2]];
  S.forEach(([a,b,at],i)=>{const x=24+(i%3)*206,y=60+Math.floor(i/3)*150;d.box(x,y,190,90,a,b,{at,hl:at+.2,c:i>4?LIME:i>2?VIOLET:CYAN});if(i%3<2)d.arrow([[x+190,y+45],[x+206,y+45]],{at,c:MUTE,head:7})});
  d.arrow([[530,150],[530,170],[118,170],[118,210]],{at:1,c:MUTE});
  d.line([[80,400],[200,392],[320,398],[440,414],[600,426]],{at:2.2,c:WARN,dur:1});d.text(600,410,'decay',{size:12,mono:1,fill:WARN,anchor:'end',at:2.3});
  d.pill('Most of the work is avoiding self-deception',2.5)},
  deep:P(`Alpha research looks for predictable patterns in returns, after costs. The horizon defines the job: microseconds to seconds for market making and HFT, minutes to days for intraday and statistical arbitrage, days to months for systematic equity and macro.`)+
  T(['Horizon','Typical features','Typical models','Main cost'],[
   ['Microseconds to seconds','Book imbalance, order flow imbalance, queue sizes, trades, cross-venue and cross-asset leads','Linear models, small trees, hand-built rules (latency matters)','Spread, fees, adverse selection'],
   ['Minutes to days','Short-term reversal and momentum, residuals from factor models, pairs, ETF versus basket, news','Linear and ridge regressions, gradient boosted trees','Impact, spread'],
   ['Days to months','Value, momentum, quality, carry, analyst revisions, alternative data','Factor models, cross-sectional regressions, ML on panels','Impact, capacity, crowding']])+
  H('Order flow imbalance, a classic feature')+EQ('OFI_t = Σ over events (Δ bid size at best if bid ≥ previous) − (Δ ask size at best if ask ≤ previous)')+
  P(`Cont, Kukanov and Stoikov (2014) showed that price changes over short intervals are roughly linear in order flow imbalance, with a slope inversely proportional to depth. It is a standard first feature for short-horizon models.`)+
  H('Validation')+UL([`<b>Point-in-time data</b>: use only what was known at the time, including index membership (survivorship bias), restated fundamentals, and the real timestamp of news.`,`<b>Walk-forward</b>: train on the past, test on the next period, roll.`,`<b>Purged and embargoed cross-validation</b> (López de Prado): remove training samples whose labels overlap the test period, otherwise overlapping returns leak information.`,`<b>Multiple testing</b>: if you try 1,000 features, some will look significant by chance. Adjust the bar (deflated Sharpe ratio, holdout sets you touch once).`])+
  H('From prediction to P&L')+UL([`Convert forecasts into positions with a portfolio construction step: maximise expected return minus risk minus transaction costs, under constraints.`,`Simulate execution realistically: latency, queue position, partial fills, fees, impact. A backtest that assumes fills at the mid is fiction for short horizons.`,`Estimate <b>capacity</b>: the size at which impact eats the alpha.`,`Monitor <b>decay</b> live: alpha fades as others find the same signal.`])+
  QA(`"Your backtest has a Sharpe ratio of 4. What do you check first?"`,`Look-ahead in the data and features, the realism of fills and costs, and how many variants were tried before this one.`)},

 {id:'model-risk',name:'Model risk management',desc:'Inventory, validation, approval, monitoring',tag:'GOVERNANCE',
  chips:['SR 11-7','PRA SS1/23','model inventory','tiering','independent validation','model reserve','limitations'],
  facts:[['Principle','Models can be wrong or misused; that is a risk to manage'],['US','Fed SR 11-7 (2011)'],['UK','PRA SS1/23'],['Steps','Inventory, tiering, development, independent validation, approval, monitoring'],['Outputs','Approval with limitations, reserves, remediation findings']],
  label:'Model lifecycle / from code to approved use',steps:['The desk quant develops and documents the model.','Validation re-implements, tests and challenges it, independently.','Approved with limits; monitored; re-validated periodically.'],draw(){
  const S=[['Develop','desk quant',0,LIME],['Document','assumptions',.15,LIME],['Validate','independent',1,VIOLET],['Approve','with limits',1.2,VIOLET],['Monitor','P&L, backtests',2,WARN],['Re-validate','periodic',2.15,WARN]];
  const cx=325,cy=240,R=150;S.forEach(([a,b,at,c],i)=>{const ang=-Math.PI/2+i*Math.PI/3,x=cx+R*1.25*Math.cos(ang)-80,y=cy+R*Math.sin(ang)-30;d.box(x,y,160,60,a,b,{at,size:15,subsize:12,hl:at+.2,c})});
  d.text(cx,cy+6,'model inventory',{size:14,mono:1,fill:SOFT,at:0});
  d.pill('A model is approved for a use, not in general',2.6)},
  deep:P(`Regulators define a <b>model</b> broadly: any quantitative method that turns inputs into estimates used for decisions. Pricing models, VaR, PFE, XVA, capital models, stress models, even some spreadsheets qualify. Since models can be wrong (bad assumptions, bad implementation, bad data) or misused (outside the products they were built for), banks must manage <b>model risk</b>. The US reference is the Fed's SR 11-7 (2011); the UK's PRA SS1/23 sets similar principles.`)+
  OL([`<b>Inventory.</b> Every model is registered with its owner, uses, products, inputs and status.`,`<b>Tiering.</b> Each model gets a tier by materiality and complexity, which sets the depth and frequency of validation.`,`<b>Development and documentation.</b> The developer documents theory, assumptions, calibration, numerical methods, testing and known limitations.`,`<b>Independent validation.</b> A separate team, reporting to risk, reviews the theory, often <b>re-implements</b> the model independently, benchmarks it against alternatives, tests stability, convergence, calibration quality, and behaviour in stress, and checks that it is suitable for its intended products.`,`<b>Approval.</b> Usually with conditions: products and parameter ranges allowed, limitations to disclose, findings to fix by a date.`,`<b>Ongoing monitoring.</b> P&L explain quality, calibration errors, backtesting of risk models, usage outside scope.`,`<b>Periodic re-validation</b> and change management: any material change goes back through validation.`])+
  H('How it reaches the P&L')+P(`If a model is approved with known weaknesses, product control may book a <b>model reserve</b> (a valuation adjustment) that reduces reported P&L until the weakness is fixed. For exotics, the day-one profit can be deferred if the valuation depends on unobservable inputs (see <a href="#ipv">Marks and IPV</a>). This gives desks a direct financial reason to have good models.`)+
  H('Why this is a career path')+P(`Validation quants must understand the model as well as its authors, and often find the bugs. It is a common entry point for quants because it gives broad exposure to every product and model in the bank.`)},
]});

 {id:'alloc-confirm',name:'Allocation and confirmation',desc:'Splitting the block and agreeing the terms',tag:'CONFIRM',

 {id:'clearing',name:'Clearing and the CCP',desc:'Novation, netting, margin and the default waterfall',tag:'CCP',
  chips:['novation','multilateral netting','initial margin','variation margin','default fund','waterfall','clearing member','FCM'],
  facts:[['Novation','The CCP becomes buyer to every seller and seller to every buyer'],['Netting','Many trades become one net position per member'],['VM','Daily (and intraday) payment of mark-to-market changes'],['IM','Collateral covering a few days of potential loss'],['Default','A waterfall of resources absorbs a member\'s default']],
  label:'Clearing / from a web to a hub, then the waterfall',steps:['Without a CCP, every pair of firms faces each other\'s default.','With a CCP, each firm faces only the CCP, and positions net.','If a member defaults, losses run down the waterfall.'],draw(){
  const P5=[[90,80],[230,60],[150,180],[60,170],[220,170]];P5.forEach(([x,y],i)=>{const g=d.g(0);el('circle',{cx:x,cy:y,r:14,fill:'#1a2a1e',stroke:MUTE},g)});
  for(let i=0;i<5;i++)for(let j=i+1;j<5;j++)d.line([P5[i],P5[j]],{at:.1,c:'#3b4a40',w:1});d.text(145,232,'bilateral',{size:12,mono:1,fill:MUTE,at:0});
  const C=[400,130];d.box(C[0]-50,C[1]-26,100,52,'CCP',null,{at:1,hl:1.1,c:VIOLET});
  [[330,60],[470,60],[310,200],[490,200],[400,230]].forEach(([x,y],i)=>{const g=d.g(1);el('circle',{cx:x,cy:y,r:14,fill:'#1a2a1e',stroke:LIME},g);d.line([[x,y],C],{at:1.05,c:LIME,w:1})});
  d.text(400,275,'cleared',{size:12,mono:1,fill:LIME,at:1});
  const W=[['1 · Defaulter\'s initial margin',LIME],['2 · Defaulter\'s default fund',LIME],['3 · CCP skin in the game',VIOLET],['4 · Survivors\' default fund',WARN],['5 · Assessments, CCP capital',CORAL]];
  W.forEach(([s,c],i)=>d.box(130,300+i*30,390,26,s,null,{at:2+i*.08,size:13,c,hl:2+i*.08,fill:NODE}));
  d.pill('A CCP turns counterparty risk into margin',2.6)},
  deep:P(`Exchange-traded trades and, since the 2009 G20 commitments, standard OTC derivatives are <b>cleared</b> through a central counterparty (CCP): LCH, Eurex Clearing, CME Clearing, ICE Clear, OCC, DTCC's NSCC and others.`)+
  OL([`<b>Novation.</b> When the trade is accepted for clearing, the original contract between buyer and seller is replaced by two contracts with the CCP. Neither side is exposed to the other any more.`,`<b>Multilateral netting.</b> A member that bought 10,000 and sold 9,500 of the same stock across the day has a net obligation of 500. For derivatives, opposite trades with different counterparties cancel. This reduces exposure, margin and settlement volume.`,`<b>Variation margin (VM).</b> Every day, and intraday in volatile markets, positions are marked to market and losers pay winners in cash through the CCP. Losses never accumulate.`,`<b>Initial margin (IM).</b> Collateral that covers the potential loss over the time it would take to close out a defaulted member's positions (a few days), at a high confidence level. Computed with models: SPAN-type scenario grids for futures and options, historical VaR or expected shortfall for swaps.`,`<b>Default fund.</b> Every member contributes to a mutualised fund sized for the default of its largest members in extreme but plausible conditions.`])+
  H('The default waterfall')+P(`If a member defaults, the CCP auctions or hedges its portfolio and uses resources in this order: the defaulter's initial margin, the defaulter's default fund contribution, the CCP's own capital tranche (skin in the game), the surviving members' default fund contributions, then further calls on members and remaining CCP capital. The order is set in the CCP's rulebook.`)+
  H('Members and clients')+P(`Only <b>clearing members</b> (large banks and brokers) face the CCP directly. Clients clear through them: a clearing member (an FCM in US futures) guarantees its clients' obligations, collects margin from them, and sets limits on their positions, which is another pre-trade credit check. Uncleared OTC derivatives are subject to bilateral initial margin rules, usually computed with ISDA's <b>SIMM</b> model.`)+
  EX('Variation margin on a future (example)',P(`You buy 10 Euro Stoxx 50 futures at 5,000. The multiplier is €10 per index point. The settlement price ends the day at 4,960. VM = 10 × (4,960 − 5,000) × 10 = <b>−€4,000</b>, paid the next morning through your clearing member. Your position is now marked at 4,960.`))},

  deep:P(`Settlement is the actual exchange: securities move from the seller's account to the buyer's at the CSD, and cash moves the other way. Until then, the trade is only a promise.`)+

 {id:'pnl',name:'P&L and P&L explain',desc:'What the desk made, and why',tag:'P&L',
  chips:['clean P&L','dirty P&L','risk-based explain','full reval','new trades','unexplained','day-one P&L','sales credits'],
  facts:[['Actual P&L','Change in value of the book plus cash, from official data'],['Explain','Delta, gamma, vega, theta, new trades, carry, residual'],['Unexplained','Should be small; a large residual points to a problem'],['Owner','Product control produces it, the trader signs it'],['FRTB link','The P&L attribution test compares risk model P&L with front P&L']],
  label:'Explain / one options book, one day (example)',steps:['The index rose 1.5% and implied vol fell 0.8 points.','Each greek explains part of the P&L.','The residual is 5% of the total: acceptable.'],draw(){
  const B=[['delta',.60],['gamma',.18],['vega',-.20],['theta',-.15],['new trades',.12],['unexpl.',.03]];
  const Y=v=>300-v*300;let c0=0;d.line([[40,300],[610,300]],{at:0,c:'#3a4a3e'});d.text(30,304,'0',{size:11,mono:1,fill:MUTE,anchor:'end',at:0});
  B.forEach(([s,v],i)=>{const x=50+i*82,y1=Y(c0),y2=Y(c0+v),col=v>=0?LIME:CORAL,at=i<2?1:i<4?1.3:2;d.bar(x,Math.min(y1,y2),62,Math.abs(y1-y2),{up:1,at,c:col,op:.8});d.text(x+31,Math.min(y1,y2)-8,(v>0?'+':'')+v.toFixed(2),{size:12,mono:1,fill:col,at});d.text(x+31,330+(i%2)*18,s,{size:12,mono:1,fill:MUTE,at});c0+=v});
  const x=50+6*82;d.bar(x,Y(.58),62,300-Y(.58),{up:1,at:2.2,c:VIOLET,op:.8});d.text(x+31,Y(.58)-8,'+0.58',{size:12,mono:1,fill:VIOLET,at:2.2});d.text(x+31,330,'total',{size:12,mono:1,fill:MUTE,at:2.2});
  d.text(24,52,'€m (example)',{size:12,mono:1,fill:MUTE,anchor:'start',at:0});
  d.pill('If you cannot explain it, you do not control it',2.5)},
  deep:P(`<b>P&L</b> is the change in the value of a book from one close to the next, plus the cash it received or paid. <b>P&L explain</b> (attribution) breaks that change into causes, using the book's sensitivities and the day's market moves:`)+
  EQ('ΔV ≈ Δ·ΔS + ½ Γ·ΔS² + ν·Δσ + Θ·Δt + ρ·Δr + cross terms + new trades + carry + unexplained')+
  EX('Worked example: an equity options book (example)',P(`Yesterday's sensitivities: delta +€0.40m per 1% move in the index, gamma +€0.16m change in delta per 1%, vega +€0.25m per vol point, theta −€0.15m per day. Today the index rose 1.5%, implied vol fell 0.8 points, and the desk did two new client trades.`)+
   T(['Line','Computation','€m'],[['Delta','0.40 × 1.5','+0.60'],['Gamma','½ × 0.16 × 1.5²','+0.18'],['Vega','0.25 × (−0.8)','−0.20'],['Theta','one day','−0.15'],['New trades','day-one P&L on two client trades','+0.12'],['Explained','sum','+0.55'],['Actual (full revaluation)','official','+0.58'],['Unexplained','actual − explained','+0.03 (5%)']])+
   P(`A 5% residual is normal: it comes from higher-order terms (vanna, volga, smile moves) and from approximations. A large or persistent residual means a missing risk, wrong data, a booking error or a model problem, and product control will not sign off until it is understood.`))+
  H('Kinds of P&L')+UL([`<b>Risk-based</b> explain uses greeks times moves; <b>full revaluation</b> reprices every trade with yesterday's and today's data, moving one factor at a time to attribute.`,`<b>Clean</b> P&L excludes new trades and fees (it measures the existing book against the market); <b>dirty</b> or total P&L includes everything. Under FRTB, backtesting uses hypothetical and actual P&L, defined precisely.`,`<b>Day-one P&L</b>: the difference between the client price and the model value at inception. For trades whose valuation relies on unobservable inputs (Level 3), accounting rules require deferring it over the trade's life.`,`<b>Sales credits</b> are a management allocation of that day-one value to sales, not a separate P&L.`])},

 {id:'ipv',name:'Marks, IPV and reserves',desc:'Who checks that the prices in the books are fair',tag:'VALUATION',
  chips:['marks','IPV','consensus data','fair value hierarchy','Level 1/2/3','bid-offer reserve','model reserve','prudent valuation','AVA'],
  facts:[['Marks','Traders set prices for inputs nobody else quotes'],['IPV','Product control checks marks against independent sources'],['Hierarchy','Level 1 quoted, Level 2 observable inputs, Level 3 unobservable'],['Reserves','Bid-offer, model, concentration, liquidity adjustments'],['Prudent valuation','Additional adjustments deducted from capital (EU)']],
  label:'IPV / trader marks against independent data (example)',steps:['The trader marks illiquid inputs, such as a long-dated vol.','Product control compares them with brokers, consensus services and trades.','Differences beyond tolerance are adjusted, and reserves are booked.'],draw(){
  const R=[['5y vol, 80% strike','trader 24.1','consensus 24.0','OK',LIME],['10y vol, ATM','trader 21.0','consensus 21.9','−0.9',WARN],['Corp bond XYZ','trader 97.50','trades 96.80','−0.70',CORAL],['Div 2030','trader 1.12','brokers 1.10','OK',LIME]];
  R.forEach(([a,b,c,dd,col],i)=>{const y=60+i*80;d.box(24,y,190,62,a,null,{at:0+i*.06,size:14});d.box(230,y,140,62,b,null,{at:.1+i*.06,size:13,mono:1});d.box(386,y,140,62,c,null,{at:1+i*.06,size:13,mono:1,c:VIOLET,hl:1.2});d.box(542,y,84,62,dd,null,{at:2+i*.06,size:14,mono:1,hl:2.2,c:col})});
  d.pill('Traders mark; someone independent checks',2.6)},
  deep:P(`Most of a bank's trading book is valued from observable market prices. The rest needs inputs that nobody quotes: a 7-year equity vol at a far strike, a correlation between two indices, a price for a bond that has not traded for a month. Traders set those inputs (their <b>marks</b>). Because traders are paid on P&L, their marks are checked independently.`)+
  H('Independent price verification (IPV)')+UL([`Product control (or a valuation control team) collects independent data: broker quotes, recent trades, consensus services where banks submit their marks and receive the consensus back (Totem from S&P Global is the best known), exchange prices, vendor prices.`,`It compares each input or position with that data, with tolerances by product.`,`Differences beyond tolerance are adjusted in the books, and the trader is asked to explain.`,`IPV runs at least monthly for all positions, more often for liquid or material ones, and results go to a valuation committee.`])+
  H('Fair value hierarchy (IFRS 13 / ASC 820)')+T(['Level','Definition','Examples'],[['Level 1','Quoted prices in active markets for identical instruments','Listed shares, futures, government bonds'],['Level 2','Observable inputs other than direct quotes','Vanilla swaps, most OTC options, liquid corporate bonds'],['Level 3','Significant unobservable inputs','Long-dated exotics, correlation trades, distressed debt, private assets']])+
  H('Valuation adjustments and reserves')+UL([`<b>Bid-offer (close-out) reserve</b>: books are marked at mid, but closing a position costs half the spread; a reserve covers it.`,`<b>Model reserve</b>: for known model limitations.`,`<b>Concentration / liquidity reserve</b>: a large position cannot be exited at the screen price.`,`<b>Day-one P&L deferral</b> for Level 3 trades.`,`<b>Prudent valuation</b> (EU capital rules): additional valuation adjustments (AVAs) for uncertainty in prices, close-out costs, model risk and others are deducted from CET1 capital.`])+
  P(`This is the second answer to the question of who validates trades: not trade by trade, but by checking every day that the P&L is explained and every month that the prices behind it are fair.`)},

 {id:'var',name:'VaR, ES and stress tests',desc:'How large a bad day can be',tag:'MARKET RISK',
  chips:['historical VaR','Monte Carlo VaR','parametric','99% 1-day','ES 97.5%','stressed VaR','backtesting','traffic light','scenarios'],
  facts:[['VaR 99% 1d','Loss exceeded on 1 day in 100, in the model'],['Method','Mostly historical simulation on 1 to 2 years of moves'],['ES','Average loss beyond the cut-off; FRTB uses 97.5%'],['Backtest','Count days when the loss exceeded VaR'],['Stress','Named scenarios, from history or hypothetical']],
  label:'Historical VaR / 500 scenarios applied to today\'s book (example)',steps:['Apply each of the last 500 days\' market moves to today\'s positions.','Sort the 500 P&Ls. The 5th worst is the 99% VaR.','Expected shortfall averages the tail beyond it.'],draw(){
  d.axes(60,60,540,300,{x:'scenario P&L (€m)',y:'count',at:0});
  const h=[1,1,2,3,5,9,15,24,36,48,58,64,62,55,44,32,20,12,6,3];const W=540/h.length;
  h.forEach((v,i)=>d.bar(60+i*W+2,360-v*4.2,W-4,v*4.2,{up:1,at:.2+i*.03,c:i<3?CORAL:i<5?WARN:LIME,op:.75}));
  d.line([[60+3.6*W,70],[60+3.6*W,360]],{at:1,c:CORAL,dash:1});d.tag(60+3.6*W+78,92,'VaR 99% = −4.3m',{at:1.1,c:CORAL});
  d.tag(60+1.8*W+60,140,'ES 99% ≈ −5.1m',{at:2,c:WARN});
  [[2.2,'−5'],[6.2,'−3'],[12.2,'0'],[18.2,'+3']].forEach(([i,s])=>d.text(60+i*W,384,s,{size:11,mono:1,fill:MUTE,at:0}));
  d.pill('A model of a bad day, not a worst case',2.5,WARN)},
  deep:P(`<b>Value at Risk</b> answers: with 99% confidence, what is the most we lose over one day (or ten), if the future looks like the past? It is the main aggregated risk number for limits and, under Basel 2.5, for capital.`)+
  H('Historical simulation, step by step')+OL([`Take the last N days of market data (for example 500 days): for each day, the move in every risk factor (each curve point, vol point, spot, spread).`,`Apply each historical move, one at a time, to <b>today's</b> positions, and revalue (full revaluation, or a sensitivity-based approximation).`,`You get N hypothetical P&Ls. Sort them. With 500 scenarios, the 99% VaR is the 5th worst loss.`,`Scale to 10 days if needed (by √10 under old rules, or with overlapping 10-day moves).`])+
  P(`Monte Carlo VaR simulates moves from a statistical model instead; parametric (variance-covariance) VaR assumes normal returns and uses the covariance matrix with the book's sensitivities. Historical simulation dominates in banks because it captures fat tails and correlations without a model, at the price of depending entirely on the chosen window.`)+
  H('Expected shortfall')+P(`VaR says nothing about how bad losses are beyond the cut-off, and it is not subadditive. <b>Expected shortfall</b> (ES) is the average loss in the tail beyond the threshold. FRTB replaced VaR with ES at 97.5%, calibrated to a stressed period and with different liquidity horizons per risk factor.`)+
  H('Stressed VaR and stress tests')+UL([`<b>Stressed VaR</b>: the same VaR, but using a one-year window of significant stress for the bank's portfolio (often including 2008).`,`<b>Historical stress scenarios</b>: replay 1987, 1998, 2008, March 2020, the 2022 gilt crisis on today's book.`,`<b>Hypothetical scenarios</b>: designed by risk managers, such as a sovereign default or a 300 bp rate shock; also regulators' scenarios (EBA, Fed CCAR).`,`<b>Reverse stress tests</b>: which scenario would cause a given loss?`])+
  H('Backtesting')+P(`Every day the actual and hypothetical P&L are compared with the previous day's VaR. An <b>exception</b> is a day when the loss exceeded VaR. At 99% you expect about 2.5 exceptions in 250 days. The Basel traffic light: 0 to 4 exceptions is green, 5 to 9 yellow (higher capital multiplier), 10 or more red. Under FRTB, backtesting is done desk by desk.`)+
  QA(`"VaR is €4.3m. Can the desk lose €20m tomorrow?"`,`Yes. VaR is a quantile of a model built from history; it says nothing about the size of tail losses, and a regime never seen in the window can break it. That is why ES, stress tests and sensitivity limits sit next to it.`)},

 {id:'ccr',name:'Counterparty credit risk',desc:'What clients could owe the bank, and the lines that cap it',tag:'CREDIT',
  chips:['current exposure','PFE','EPE','netting set','CSA','threshold','credit line','wrong-way risk','SA-CCR'],
  facts:[['Exposure','What we lose if the client defaults today: max(value, 0) after netting and collateral'],['PFE','A high percentile of future exposure, path by path'],['Lines','Credit risk sets a PFE limit per client; checked pre-trade'],['Mitigants','Netting (ISDA), collateral (CSA), clearing'],['Capital','SA-CCR or internal models']],
  label:'One client: exposure against its credit line (example)',steps:['Gross exposure across 40 trades with one client.','Netting under the ISDA, then collateral under the CSA, reduce it.','The PFE peak must stay under the credit line; a new trade is checked first.'],draw(){
  const B=[['gross',180,MUTE,0],['after netting',95,VIOLET,1],['after collateral',35,LIME,1.2]];
  B.forEach(([s,v,c,at],i)=>{d.bar(80+i*150,360-v,100,v,{up:1,at,c,op:.75});d.text(130+i*150,350-v,'$'+v+'m',{size:13,mono:1,fill:c,at});d.text(130+i*150,384,s,{size:12,mono:1,fill:MUTE,at})});
  d.line([[60,360],[600,360]],{at:0,c:'#3a4a3e'});
  d.line([[60,360-120],[600,360-120]],{at:2,c:WARN,dash:1});d.text(596,232,'PFE line $120m',{size:12,mono:1,fill:WARN,anchor:'end',at:2});
  d.bar(530,360-70,60,70,{up:1,at:2.2,c:CYAN,op:.75});d.text(560,282,'PFE 70',{size:12,mono:1,fill:CYAN,at:2.2});d.text(560,384,'peak PFE',{size:12,mono:1,fill:MUTE,at:2.2});
  d.pill('A new trade is checked against the remaining line',2.6)},
  deep:P(`Market risk is about prices moving. <b>Counterparty credit risk</b> is about a client defaulting while it owes the bank money on derivatives or financing. It is managed by a separate credit risk function, with its own limits (<b>credit lines</b>), checked before each trade.`)+
  H('Measures')+UL([`<b>Current exposure</b>: max(0, net value of all trades in the netting set − collateral held).`,`<b>Potential future exposure (PFE)</b>: a high percentile (95% or 97.5%) of exposure at future dates, from a Monte Carlo simulation of the market (see <a href="#xva">XVA</a>). The peak PFE is compared with the credit line.`,`<b>Expected positive exposure (EPE)</b>: the average exposure, used for CVA and capital.`])+
  H('Mitigants')+UL([`<b>Netting</b>: under an ISDA master agreement, all trades with one counterparty become one net amount on default (where netting is legally enforceable).`,`<b>Collateral</b>: under a CSA, the counterparty posts variation margin daily when the bank is in the money, sometimes above a threshold and minimum transfer amount; large dealers also exchange initial margin for uncleared trades.`,`<b>Clearing</b>: the CCP replaces the client as counterparty.`,`<b>Hedging</b>: the XVA desk buys CDS protection.`])+
  H('The pre-trade credit check')+P(`Before a new derivative trade with a client, the trading system calls the <b>credit hub</b>: it computes the incremental PFE of the new trade on the existing netting set and checks it against the remaining line. Within the line, the trade goes ahead automatically; beyond it, a credit officer must approve an excess, or the trade is restructured (shorter, collateralised, cleared). This is one of the few real-time human approvals in the process.`)+
  WARNBOX(`<b>Archegos, March 2021.</b> A family office built very large concentrated equity positions through total return swaps with several prime brokers, none of whom saw the total. When the stocks fell, it could not meet margin calls; the banks that sold slowly lost heavily (Credit Suisse about $5.5bn, Nomura nearly $3bn). The failures were in counterparty risk: margin terms too loose for the concentration, limits breached for months, and no view of the client's positions at other banks.`)},

 {id:'oprisk',name:'Rogue trading controls',desc:'What stops a trader hiding a position',tag:'CONTROLS',
  chips:['segregation of duties','mandatory leave','cancel and amend monitoring','confirmations','nostro recs','Kerviel','Adoboli','London Whale'],
  facts:[['Segregation','Traders cannot book, confirm or settle their own trades alone'],['Leave','Two consecutive weeks off, away from the systems'],['Monitoring','Cancels, amendments, late bookings, off-market trades, internal trades'],['External','Confirmations with counterparties, reconciliations with CCPs and custodians'],['Lesson','Large frauds exploited gaps between these controls']],
  label:'Controls / the ring around a trader',steps:['A trader books trades but cannot confirm or settle them.','Independent teams check every trade with an outside party.','Patterns are monitored: cancels, fake hedges, late bookings, leave.'],draw(){
  d.box(250,190,150,80,'Trader',null,{at:0,hl:.1,c:WARN});
  const C=[['Booking checks',325,70,1],['Confirmations',540,150,1.1],['Reconciliations',540,320,1.2],['Cancel/amend alerts',325,400,2],['Mandatory leave',110,320,2.1],['P&L explain',110,150,2.2]];
  C.forEach(([s,x,y,at])=>{d.box(x-95,y-28,190,56,s,null,{at,size:14,hl:at+.2});d.line([[x,y],[325,230]],{at,c:'#3b4a40'})});
  d.pill('No single person controls a trade end to end',2.6)},
  deep:P(`Every major rogue trading case exploited a gap between controls that each looked fine on their own. Modern banks layer controls so that a hidden position would have to fool several independent teams and outside parties at once.`)+
  T(['Case','What happened','The gap'],[
   ['Barings, 1995 (Nick Leeson)','About £827m lost on Nikkei futures and options hidden in an error account; the bank collapsed','The trader also ran the back office in Singapore'],
   ['Société Générale, 2008 (Jérôme Kerviel)','€4.9bn lost unwinding about €50bn of hidden index futures positions, offset by fictitious trades','Fake offsetting trades not confirmed with counterparties; alerts not escalated'],
   ['UBS, 2011 (Kweku Adoboli)','About $2.3bn lost on ETF and index futures positions hidden with fictitious forward-settling ETF trades','Unconfirmed internal or late-settling trades; weak supervision'],
   ['JPMorgan, 2012 (London Whale)','About $6.2bn lost on a huge credit index position in the CIO office','VaR model change that halved measured risk; marks that drifted; limit breaches ignored'],
   ['Archegos, 2021','Over $10bn lost across prime brokers','Counterparty risk: concentration and margin, not a rogue trader']])+
  H('The standard set of controls')+UL([`<b>Segregation of duties</b>: the trader books; trade support validates; operations confirms with the counterparty; settlements settles; product control values. System access enforces it.`,`<b>External confirmation</b> of every trade, and reconciliation of positions and cash with CCPs, brokers and custodians. A fictitious trade fails here.`,`<b>Monitoring of patterns</b>: trades cancelled or amended soon after booking, trades booked late or back-dated, off-market prices, large internal trades, trades with pending settlement far in the future, unusual P&L smoothness.`,`<b>Mandatory leave</b>: usually two consecutive weeks a year with no system access, so someone else runs the book and sees what is in it.`,`<b>P&L explain and IPV</b>: P&L that does not match the risk, or marks that drift away from consensus.`,`<b>Escalation</b>: alerts must be followed up and closed with evidence, not cleared by the person being watched.`])+
  P(`Operational risk also covers algorithm failures (see <a href="#risk-gate">Knight Capital</a>), fat-finger errors, cyber attacks and system outages. Under Basel rules, banks hold capital for operational risk too.`)},
]},

{id:'workflows',name:'Workflows',sub:'Four complete trades, every step in order.',rows:[
 {id:'wf-equity',name:'Agency equity order, end to end',desc:'From a PM\'s decision to shares in custody',tag:'T → T+2',
  chips:['OMS','FIX','algo','SOR','colo','matching','exec reports','booking','allocation','CCP','CSD','MiFIR','TCA'],
  facts:[['Scenario','Buy 300,000 shares of a large European stock (example)'],['Capacity','Agency, VWAP algo'],['Duration','Execution over one day; settlement on T+2'],['Systems touched','About 15'],['Records created','Thousands: one parent, hundreds of children, fills, reports']],
  label:'Timeline / one order (example)',steps:['Trade date morning: decision, order, checks, the algo starts.','During the day: hundreds of child orders, fills, booking, risk.','Evening to T+2: allocation, confirmation, clearing, settlement, reporting.'],draw(){
  d.line([[40,110],[610,110]],{at:0,c:'#4a5a4e',dur:.8});
  const M=[['08:40','decision',60,0],['08:42','FIX to bank',150,.1],['08:43','checks, algo',240,.2],['09:00','first child',330,.3],['17:35','last fill',420,1],['17:40','done, booked',510,1.1]];
  M.forEach(([t,s,x,at],i)=>{const g=d.g(at,{dy:0});el('circle',{cx:x,cy:110,r:6,fill:LIME},g);d.text(x,90,t,{size:12,mono:1,fill:LIME,at});d.text(x,136+(i%2)*18,s,{size:12,fill:SOFT,at})});
  d.box(24,190,602,60,'≈ 600 child orders · ≈ 1,400 fills · 6 venues · dark and lit',null,{at:1.2,size:14,hl:1.4});
  d.line([[40,300],[610,300]],{at:2,c:'#4a5a4e',dur:.8});
  const M2=[['T','allocation',80],['T','confirm, affirm',220],['T+1','MiFIR report',360],['T+2','DVP at CSD',500]];
  M2.forEach(([t,s,x],i)=>{const g=d.g(2+i*.08,{dy:0});el('circle',{cx:x,cy:300,r:6,fill:VIOLET},g);d.text(x,282,t,{size:12,mono:1,fill:VIOLET,at:2+i*.08});d.text(x,326,s,{size:12,fill:SOFT,at:2+i*.08})});
  d.box(24,360,602,60,'Public trade reports: within a minute of each fill',null,{at:2.3,size:14});
  d.pill('One decision, thousands of records',2.6)},
  deep:P(`This is the complete sequence for the order on the Trade map, with the system, the message and what gets stored at each step. Times, sizes and counts are illustrative.`)+
  H('Trade date: before the market')+OL([`<b>08:40 · Decision.</b> A portfolio manager at an asset manager decides to buy 300,000 ACME for two funds. The order is created in the buy-side <b>OMS</b> (order management system), which checks the fund's investment restrictions (concentration, prohibited issuers) and records the decision time and decision maker.`,`<b>08:41 · Broker choice.</b> The buy-side trader, using an EMS (execution management system) and pre-trade TCA, picks a broker and a strategy: VWAP until the close, limit 41.00, maximum 15% of volume.`,`<b>08:42 · FIX order.</b> The EMS sends a NewOrderSingle (35=D) to the bank's client gateway, with strategy parameters in custom tags. The bank stores the order with its own timestamp.`,`<b>08:42 · Client checks.</b> The bank's OMS validates the client account, the client's trading limits and credit, the restricted list, and the instrument. It acknowledges with an ExecutionReport (150=0 New).`,`<b>08:43 · Internal crossing.</b> The order is offered to the bank's central risk book and crossing engine. Here an opposite client sell of 40,000 crosses at mid during the day, with both clients' consent.`,`<b>08:43 · Algo start.</b> The VWAP algo loads the stock's volume profile, volatility, spread and impact estimates, and computes its schedule: about 16% of the order in the first hour, a large share reserved for the closing auction.`])+
  H('Trade date: during the market')+OL([`<b>09:00 onward · Child orders.</b> Each scheduling interval, the placement logic decides how much to post passively and how much to take. The smart order router splits each child across venues (primary exchange, MTFs, mid-point dark pools) with latency-equalised timing.`,`<b>Every child · Pre-trade gate.</b> The market access controls check size, price collar, notional and message rate in microseconds. Then the order leaves the colocated server over a cross-connect to the venue's gateway, in the venue's native protocol.`,`<b>Every child · Matching.</b> At the venue: gateway checks, sequencer, matching engine. Fills generate execution reports to the bank and public trade messages on the feed. The trades are sent to the CCP.`,`<b>Every fill · Updates.</b> The algo updates its progress against schedule; the parent order's CumQty and average price update; the client receives fills by FIX (often aggregated); drop copies feed the bank's risk systems.`,`<b>Every fill · Transparency.</b> The venue publishes each on-venue trade immediately; any OTC part (the internal cross, if done as an SI) is published through the bank's APA within the deadline.`,`<b>Intraday · Monitoring.</b> The bank's execution desk watches the order on a blotter; alerts fire if slippage against the benchmark or participation exceeds thresholds. Surveillance systems scan for patterns of abuse across all orders.`,`<b>17:30 · Close.</b> The algo sends its remaining quantity to the closing auction (MOC or LOC). The uncrossing fills it at the closing price.`,`<b>17:40 · Done.</b> The final ExecutionReport shows Filled: 300,000 at an average price. The bank's records now contain one parent order, about 600 child orders, about 1,400 fills, each with venue, fill ID, fee and liquidity flag.`])+
  H('Trade date: evening')+OL([`<b>Booking.</b> The fills are aggregated and booked against the client's account: as agency, the bank faces the client, and its own market-side trades face the CCP. Commission is computed (for example 3 bp).`,`<b>Allocation.</b> The asset manager sends allocations: 200,000 to fund A, 100,000 to fund B, at the same average price.`,`<b>Confirmation and affirmation.</b> The bank sends confirmations per allocation; the asset manager affirms them on the central matching platform, which sends settlement instructions to the custodians.`,`<b>Clearing.</b> The CCP has received all the bank's on-exchange trades during the day, nets them with the bank's other trades in ACME, and calls margin overnight.`])+
  H('After trade date')+OL([`<b>T+1 · Regulatory reporting.</b> The bank files MiFIR transaction reports for its executions via its ARM (the asset manager reports its own side, or relies on the broker under agreed rules). Order records are archived.`,`<b>T+1 · TCA.</b> The bank sends the client a TCA report: arrival price, VWAP, implementation shortfall, by venue and phase. The client feeds it into its broker review.`,`<b>T+2 · Settlement.</b> At the CSD, DVP moves 300,000 shares from the CCP's or the bank's account into the funds' custodian accounts and the cash the other way. Commission is settled with the trade.`,`<b>T+2 onward · Reconciliation.</b> Operations reconciles fills, bookings, CCP positions, settlement status and cash. Any break is chased. The funds' custodian now holds the shares, collects dividends and handles corporate actions.`])},

 {id:'wf-hft',name:'A market maker\'s quote cycle',desc:'Tick, fair value, requote, fill, hedge, in microseconds',tag:'µs LOOP',
  chips:['tick','fair value','requote','cancel/replace','fill','hedge','risk server','kill switch'],
  facts:[['Scenario','An electronic market maker quoting an ETF and hedging in futures (example)'],['Cycle','Thousands of times per second'],['Critical path','Feed → fair value → quote decision → risk → order entry'],['Feedback','Fills update inventory, which moves quotes'],['Guards','Position, loss and message-rate limits, kill switch']],
  label:'Loop / one reaction (example)',steps:['A futures tick in Chicago reaches the New Jersey server by microwave.','Fair value of the ETF moves; quotes are cancelled and replaced.','A fill arrives; inventory changes; the hedger trades futures.'],draw(){
  const cx=325,cy=235,R=150;const S=[['Futures tick','microwave',0,CYAN],['Fair value','+0.02',.2,VIOLET],['Requote','cancel / replace',1,LIME],['Risk check','in line',1.1,WARN],['Fill','bought 2,000',2,LIME],['Hedge','sell futures',2.2,VIOLET]];
  S.forEach(([a,b,at,c],i)=>{const ang=-Math.PI/2+i*Math.PI/3,x=cx+R*1.3*Math.cos(ang),y=cy+R*Math.sin(ang);d.box(x-85,y-30,170,60,a,b,{at,size:15,subsize:12,hl:at+.2,c})});
  const P=[];for(let i=0;i<=60;i++){const a=-Math.PI/2+i/60*2*Math.PI;P.push([cx+R*.85*Math.cos(a),cy+R*.6*Math.sin(a)])}d.line(P,{at:0,c:'#3b4a40',dur:2});d.packet(P,0.2,{dur:2.4});
  d.text(cx,cy-4,'≈ 5–20 µs',{size:20,mono:1,fill:INK,at:.5});d.text(cx,cy+20,'tick to new quote (example)',{size:12,mono:1,fill:MUTE,at:.5});
  d.pill('React, quote, get filled, hedge, again',2.6)},
  deep:P(`An electronic market maker quotes an ETF on several European or US venues and hedges with index futures. Its loop runs continuously; here is one turn.`)+
  OL([`<b>t = 0 · Futures tick.</b> The index future trades up one tick in its home data centre. The firm's server there decodes the packet and sends the new price over its microwave link to the data centre where the ETF trades.`,`<b>t ≈ 4 ms (geography) + 1 µs · Arrival.</b> The packet reaches the ETF server's network card; kernel bypass hands it to the strategy thread.`,`<b>+1 µs · Fair value.</b> The model recomputes the ETF's fair value: the future's move times the ETF's beta, plus the ETF's own book signals (imbalance, recent trades) and the basket's live value.`,`<b>+0.5 µs · Quote decision.</b> The current bid and ask are now too low. The strategy decides to cancel and replace both, shifted up by 2 cents, with sizes adjusted for inventory and for the queue position it will lose.`,`<b>+0.2 µs · Risk check.</b> The in-line risk layer checks position limits, maximum order size, price collar and message rate. Pass.`,`<b>+0.5 µs · Send.</b> Cancel/replace messages leave in the venue's binary protocol on every venue it quotes, timed so they arrive together.`,`<b>+10 to 50 µs · Venue.</b> Each venue acknowledges. Meanwhile, a slower participant hits the old ask on one venue before the cancel arrived: the market maker sold 2,000 shares at the stale price. That is the adverse selection the speed race is about.`,`<b>Fill · Inventory.</b> The fill updates inventory (now short 2,000), which moves the reservation price up: quotes are skewed to buy back.`,`<b>Hedge.</b> If the short exceeds the hedge threshold, the hedger buys futures. Otherwise the firm waits for natural buy flow to offset it.`,`<b>Continuous · Guards.</b> The risk server tracks position, P&L per minute and message rates; if any limit breaks, it pulls all quotes. A human risk team watches dashboards and can hit the firm-wide kill switch.`,`<b>End of day · Research loop.</b> Every event is logged with hardware timestamps. Overnight, researchers compute markouts per venue and counterparty type, latency distributions, missed fills, and recalibrate parameters for the next day.`])+
  P(`The economics: a few tenths of a basis point of edge per trade, millions of trades, and losses concentrated in moments of stale quotes. The whole stack in the Infrastructure and Microstructure chapters exists to shift that balance.`)},

 {id:'wf-swap',name:'An interest rate swap via RFQ',desc:'From a client request to a cleared, hedged, reported swap',tag:'OTC',
  chips:['RFQ','curve','DV01','credit check','clearing broker','LCH SwapClear','hedge','EMIR','fixings','compression'],
  facts:[['Scenario','An asset manager pays fixed on €100m of 10-year EUR swaps (example)'],['Venue','RFQ to four dealers on an MTF'],['Clearing','LCH SwapClear via the client\'s clearing broker'],['Risk','About €87k per basis point of DV01 for the winning dealer'],['Life','Ten years of fixings, coupons and daily margin']],
  label:'Swap / request to lifecycle (example)',steps:['RFQ: the auto-quoter prices from the curve, inventory and client.','Win: limit check by the clearing broker, then clearing at the CCP.','The dealer hedges its DV01; the trade is reported and lives for ten years.'],draw(){
  const S=[['RFQ','€100m 10y',0,VIOLET],['Price','2.685% mid',.15,VIOLET],['Quote','2.690%',.3,VIOLET],['Win','limit check',1,LIME],['Clear','LCH',1.15,LIME],['Hedge','DV01 €87k',1.3,LIME],['Report','EMIR T+1',2,WARN],['Margin','daily VM',2.1,WARN],['Fixings','6M EURIBOR',2.2,WARN]];
  S.forEach(([a,b,at,c],i)=>{const x=24+(i%3)*206,y=60+Math.floor(i/3)*120;d.box(x,y,190,90,a,b,{at,hl:at+.2,c,submono:1});if(i%3<2)d.arrow([[x+190,y+45],[x+206,y+45]],{at,c:MUTE,head:7})});
  d.arrow([[530,150],[530,166],[118,166],[118,180]],{at:1,c:MUTE});d.arrow([[530,270],[530,286],[118,286],[118,300]],{at:2,c:MUTE});
  d.pill('Seconds to trade, ten years to live',2.6)},
  deep:P(`An asset manager wants to hedge the rate risk of a bond portfolio by paying fixed on €100m of a 10-year EUR swap against 6-month EURIBOR. Numbers are illustrative.`)+
  OL([`<b>Request.</b> On an MTF (for example Tradeweb), the client sends an RFQ to four dealers: pay fixed, €100m, 10 years, standard conventions, cleared at LCH.`,`<b>Pre-trade clearing check.</b> Because the trade will be cleared, the platform asks the client's clearing broker to confirm that the trade fits within the client's clearing limits. Without that, the trade could not be accepted at the CCP.`,`<b>Pricing.</b> Each dealer's auto-quoter values the swap off its live curves: the mid par rate is 2.685%. The desk is already receiving fixed in 10 years from another client, so it is happy to take the opposite: its skew improves the price. It adds a spread for size and the client's tier and quotes 2.690% (the client pays fixed, so a higher rate is better for the dealer).`,`<b>Win.</b> The client accepts the best quote. The platform sends the trade to both parties and to the CCP. The dealer's system books it automatically with the UTI from the platform.`,`<b>Clearing.</b> LCH accepts the trade, novates it, and from now on both sides face LCH (the client through its clearing broker). Initial margin is called from both.`,`<b>Hedging.</b> The dealer now receives fixed on €100m for 10 years. DV01 ≈ €100m × annuity (about 8.7) × 0.0001 ≈ €87k per bp. Part offsets the existing position; the rest is hedged within seconds with Bund futures or by paying fixed in the interdealer market, or kept within the desk's DV01 limits if the trader wants the risk.`,`<b>Day-one P&L.</b> 0.5 bp of running spread on the price × €87k per bp ≈ €43k of value at inception, recognised because the inputs are observable (Level 2).`,`<b>Reporting.</b> The platform publishes the trade (with deferrals for size); both sides report to an EMIR trade repository by T+1 with the UTI, then daily valuations and margin.`,`<b>Life.</b> Every six months EURIBOR fixes and the floating coupon is set; fixed and floating coupons are exchanged through the CCP; daily variation margin flows; the dealer's curve book carries the risk among thousands of other swaps.`,`<b>Compression.</b> Periodically, the dealer submits its cleared portfolio to a compression run that tears up offsetting trades, reducing gross notional and capital, without changing its net risk.`])},

 {id:'wf-exotic',name:'A structured product',desc:'An autocallable note from idea to hedging',tag:'EXOTIC',

  d.tag(278,y(108),'year 2: 94%, no call',{at:1.3,c:VIOLET});d.tag(382,y(110),'year 3: 102%, called',{at:1.6,c:LIME});
  d.box(24,330,190,90,'Structuring','coupon 7.5%',{at:2,size:15});d.box(230,330,190,90,'Desk','LSV Monte Carlo',{at:2.1,size:15});d.box(436,330,190,90,'Hedging','delta, vega, divs',{at:2.2,size:15,hl:2.4,c:WARN});
  d.pill('Investor sells options, gets a coupon',2.6)},
  deep:P(`A private bank wants a product for clients who expect European equities to stay roughly flat: a 5-year <b>autocallable</b> on the Euro Stoxx 50. Terms (example): each year, if the index is at or above 100% of its initial level, the note redeems early at 100% plus 7.5% per elapsed year; at maturity, capital is protected unless the index is below 60%, in which case the investor takes the full loss.`)+
  OL([`<b>Design.</b> The structurer works backwards from the target coupon. The investor is effectively selling the bank a down-and-in put (the 60% barrier) and the upside above the coupon, and the bank uses that premium plus the dividends it keeps by hedging to pay the coupon. Parameters (coupon, barrier, autocall level) are tuned until the price leaves a margin for the bank and the distributor.`,`<b>Approval.</b> Autocallables on major indices are an approved product type, so no new product approval is needed. A new feature (a new underlying, a new barrier type) would go through NPA. The trade is checked for suitability rules and the distributor's requirements.`,`<b>Pricing.</b> The desk prices with a <b>local-stochastic volatility</b> Monte Carlo model calibrated to the vol surface, with dividend and repo curves, because the product depends on the forward smile (barrier and autocall probabilities). The fair value is perhaps 96.5% of notional; the note is sold at 100%: 3.5% covers the distributor's fee (for example 1.5% to 2%) and the bank's margin and hedging costs. The bank's funding level also enters, because the note is the bank's own debt.`,`<b>Issuance.</b> The bank's issuing entity issues the note under its EMTN programme with a final terms document; a KID (key information document under PRIIPs) is produced for retail investors. The distributor sells it over a subscription period; the strike is set on the strike date.`,`<b>Booking and day-one P&L.</b> The note and its embedded derivative are booked in the exotics book. If valuation depends on unobservable inputs (long-dated skew, for example), part of the day-one P&L is deferred.`,`<b>Hedging.</b> The desk is left long the down-and-in put (long downside vega and skew), long dividends, and with gap risk near the barrier. It delta-hedges daily with futures, sells listed long-dated options and dividend futures to reduce vega and dividend exposure, and manages the barrier risk with reserves and limits. Because many banks sell similar products, they all end up with the same risk, which affects long-dated vol and dividend markets.`,`<b>Life.</b> Each year the observation is recorded; if the index is above 100%, the note redeems and the hedges are unwound. In the example the note is called in year 3 and pays 122.5%.`])+
  P(`Quants are involved at every step: the pricing model, its calibration and validation, the hedge simulations, the reserves, and the risk engine that aggregates thousands of such notes.`)},
]},

{id:'career',name:'Quant careers',sub:'What the roles are, and what to master for interviews.',rows:[
 {id:'quant-roles',name:'Quant roles and what they do',desc:'From research to validation, by distance to P&L',tag:'ROLES',
  chips:['quant researcher','quant trader','desk quant / strat','quant developer','e-trading quant','risk quant','model validation','XVA quant'],
  facts:[['Closest to P&L','Quant traders, quant researchers at funds, e-trading quants'],['Core bank roles','Desk quants (strats), quant developers'],['Second line','Risk quants, model validation'],['Common core','Probability, statistics, programming, markets'],['Differences','Horizon, language, data, how success is measured']],
  label:'Roles / by distance to P&L',steps:['Front-office roles live on P&L and speed.','Engineering roles build the systems everything runs on.','Control roles challenge and measure, independently.'],draw(){
  d.line([[60,410],[60,60]],{at:0,c:LIME,dur:.8});d.text(72,72,'closer to P&L',{size:12,mono:1,fill:LIME,anchor:'start',at:0});
  const R=[['Quant trader','prop, market making',90,0,LIME],['Quant researcher','alpha, funds',150,.1,LIME],['E-trading quant','pricing, algos',210,.2,LIME],['Desk quant / strat','pricing, risk tools',270,1,VIOLET],['Quant developer','systems, latency',330,1.1,VIOLET],['Risk / validation','models, capital',390,2,WARN]];
  R.forEach(([a,b,y,at,c])=>d.box(110,y-26,516,52,a+' · '+b,null,{at,size:15,hl:at+.2,c}));
  d.pill('Same maths, different questions',2.6)},
  deep:T(['Role','Where','What you do','Typical stack','How you are judged'],[
   ['Quant trader','Prop firms, market makers, some banks','Run strategies, set parameters, manage risk live, research improvements','Python, internal tools, sometimes C++','P&L and risk-adjusted return'],
   ['Quant researcher','Hedge funds, systematic funds, market makers','Find signals, build models, backtest, portfolio construction','Python, pandas/polars, numpy, ML libraries, kdb+/q, SQL','Out-of-sample performance, live P&L of your signals'],
   ['E-trading / algo quant','Banks, brokers','Pricing engines, auto-quoters, execution algos, TCA, microstructure models','Python for research, C++ or Java in production','Hit ratios, markouts, client TCA, desk P&L'],
   ['Desk quant / strat','Banks','Pricing models and libraries, risk tools, hedging analysis, structuring support','C++ library with Python bindings, or in-house platforms','Desk adoption, correct prices and risk, speed'],
   ['Quant developer','Everywhere','Low-latency systems, pricing and risk engines, data platforms, backtesters','C++ (modern, low-latency), Python, Rust, Java, kdb+','Performance, reliability, delivery'],
   ['Risk quant','Banks, CCPs','VaR, ES, stress, counterparty exposure, margin models, FRTB','Python, C++, SQL','Model accuracy, regulatory approval'],
   ['Model validation','Banks','Independent review and re-implementation of models','Python, C++, MATLAB','Quality of findings'],
   ['XVA quant','Banks','Exposure simulation, CVA/FVA/KVA pricing and hedging, performance (AAD, GPU)','C++, Python','Speed and accuracy of incremental pricing']])+
  H('How to place yourself')+P(`Ask three questions of any role: what is the horizon (microseconds, days, years), what is the output (a price, a signal, a system, a report), and who uses it (a trader, a client, a regulator, a machine). This guide covers the plumbing that is common to all of them; interviews test whether you understand where your future work fits into it.`)},

 {id:'prep',name:'What to master for interviews',desc:'Topics, classic questions and how this guide maps to them',tag:'PREP',
  chips:['probability','stochastic calculus','statistics','linear algebra','C++','Python','microstructure','derivatives','brainteasers'],
  facts:[['Maths','Probability, stochastic calculus, statistics, linear algebra, optimisation'],['Code','Python fluently; C++ for many roles; data structures and complexity'],['Markets','This guide: products, microstructure, risk, the trade lifecycle'],['Format','Mental maths, probability puzzles, coding, a model discussion, a market case'],['Habit','Explain every answer with a concrete number']],
  label:'Preparation / five areas (example weighting varies by role)',steps:['Probability and statistics come up in every quant interview.','Programming and one specialty depend on the role.','Market understanding separates candidates at the final rounds.'],draw(){
  const A=[['Probability & statistics','every role',0,LIME],['Stochastic calculus','pricing, risk',.15,LIME],['Programming','Python, C++',1,VIOLET],['Specialty','alpha, pricing, latency',1.15,VIOLET],['Markets & plumbing','this guide',2,WARN]];
  A.forEach(([a,b,at,c],i)=>d.box(24+(i%2)*306,52+Math.floor(i/2)*120,296,96,a,b,{at,hl:at+.2,c}));
  d.pill('Explain with numbers, not with adjectives',2.6)},
  deep:H('Maths and statistics')+UL([`<b>Probability</b>: conditional probability and Bayes, expectations and conditioning tricks, common distributions, Markov chains, martingales and stopping times, order statistics. Classic: expected number of tosses to get two heads in a row (6); the gambler's ruin.`,`<b>Stochastic calculus</b>: Brownian motion, Itô's lemma, geometric Brownian motion, Girsanov and risk-neutral pricing, Black-Scholes derivation (PDE and martingale), Feynman-Kac.`,`<b>Statistics and ML</b>: linear regression and its assumptions, regularisation (ridge, lasso), overfitting, cross-validation for time series, PCA, maximum likelihood, hypothesis testing and multiple testing, time-series basics (stationarity, autocorrelation, AR models).`,`<b>Linear algebra and optimisation</b>: eigenvalues, positive definiteness of covariance matrices, Cholesky, least squares, convex optimisation, mean-variance portfolios.`,`<b>Numerical methods</b>: Monte Carlo and variance reduction, finite differences, root finding, interpolation.`])+
  H('Programming')+UL([`Python: numpy and pandas fluently, vectorisation, writing a backtest or a Monte Carlo pricer from scratch.`,`C++ (for quant dev, HFT, desk quant roles): memory model, RAII, move semantics, templates, the cost of virtual calls, cache effects, lock-free basics, data structures for an order book.`,`Algorithms and complexity, as in software interviews, especially for trading firms.`])+
  H('Market questions this guide prepares you for')+T(['Question','Where in this guide'],[
   ['Walk me through what happens when you click buy.','<a href="#map">Trade map</a>, <a href="#wf-equity">Agency equity workflow</a>'],
   ['What is the difference between agency and principal?','<a href="#agency-principal">Agent or principal</a>'],
   ['How does a matching engine work? What is price-time priority?','<a href="#lob">The limit order book</a>, <a href="#exchange-inside">Inside the exchange</a>'],
   ['Why do firms pay for colocation and microwave links?','<a href="#colo">Colocation</a>, <a href="#links">Between data centres</a>'],
   ['How would you design a feed handler or an order book in C++?','<a href="#feed">Feed handling</a>, <a href="#lowlat">Low-latency engineering</a>'],
   ['How does a market maker set its quotes?','<a href="#mm-model">Market-making models</a>, <a href="#fees">Adverse selection</a>'],
   ['How would you execute a large order? What is implementation shortfall?','<a href="#algos">Execution algorithms</a>, <a href="#tca">TCA</a>, <a href="#liquidity">Impact</a>'],
   ['How is a swap priced? What is DV01?','<a href="#curves">Curves</a>, <a href="#wf-swap">Swap workflow</a>'],
   ['Explain the volatility smile and local vol.','<a href="#vol">Vol surfaces</a>, <a href="#pricing">Pricing models</a>'],
   ['What is gamma P&L? How do you hedge an option?','<a href="#greeks">Greeks</a>'],
   ['What is CVA and who pays for it?','<a href="#xva">XVA</a>'],
   ['How do traders\' limits work? Who approves a trade?','<a href="#appetite">Cascade</a>, <a href="#pretrade-gov">What needs a yes</a>'],
   ['What is VaR and what are its limits?','<a href="#var">VaR, ES and stress</a>'],
   ['What does a CCP do?','<a href="#clearing">Clearing</a>'],
   ['What happens after the trade?','<a href="#post">Post-trade</a> chapters']])+
  H('How to answer')+P(`Interviewers listen for two things: that you know the mechanism, and that you can put a number on it. "Impact grows with the square root of size, so 10% of ADV in a 2% vol stock costs about 40 bp" beats "impact depends on size". Every chapter in this guide has at least one such number; practise saying them out loud.`)},
]});
</script>
<script>
/* Navigation, animation and reading mode, adapted from engine/app.js. */
const COMPS=VIEWS.flatMap(v=>v.rows.map(r=>({...r,view:v.id}))),ORDER=['map',...COMPS.map(c=>c.id)];
const S={view:'map',id:'map',t:0,tour:false,last:0,steps:TRACE.map(s=>s[0]),paused:false,mode:'explore',shown:-1,hold:0};

function drawMap(){
 svg.setAttribute('viewBox','0 0 1100 600');
 ZONES.forEach(({x,w,label})=>{el('rect',{x,y:48,width:w-10,height:510,rx:14,fill:'#090f0c',stroke:'#1f2a24'});txt(svg,x+14,34,label,{size:13,mono:1,fill:MUTE,anchor:'start',ls:'.14em'})});
 const paths={},hot={},lit={};
 for(const k in E)paths[k]=el('path',{d:path(E[k]),fill:'none',stroke:'#34443a','stroke-width':1.5});
 for(const k in E)hot[k]=el('path',{d:path(E[k]),fill:'none',stroke:LIME,'stroke-width':2.4});
 for(const k in N){const[x,y,w,h,a,b,to]=N[k],g=el('g');el('rect',{x,y,width:w,height:h,rx:11,fill:NODE,stroke:LINE},g);
  txt(g,x+w/2,y+(b?h/2-3:h/2+6),a,{size:w<160?15:16,w:500});if(b)txt(g,x+w/2,y+h/2+18,b,{size:12,fill:MUTE});
  lit[k]=el('rect',{x,y,width:w,height:h,rx:11,fill:'#c6f13518',stroke:LIME,'stroke-width':2,'pointer-events':'none'},g);link(g,to,a)}
 const dot=[0,1,2,3].map(()=>el('circle',{r:5,fill:LIME}));
 U.push(t=>{const s=Math.floor(t/STEP),[,ns,es]=TRACE[Math.min(s,TRACE.length-1)],since=t-s*STEP,p=ease(since/.35);
  for(const k in lit)lit[k].style.opacity=ns.includes(k)?p:0;
  for(const k in hot)hot[k].style.opacity=es.includes(k)?1:0;
  dot.forEach((c,i)=>{const k=es[i];if(!k){c.style.opacity=0;return}const q=paths[k],L=q.getTotalLength(),pt=q.getPointAtLength(L*((since/1.4)%1));c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y);c.style.opacity=1})})}

function seek(t){
 for(const a of A){const p=ease((t-a.tin)/.42),s=a.e.style;s.opacity=t>=a.tin?p:0;s.transform=`translateY(${a.dy*(1-p)}px)`;const b=a.blur*(1-p);s.filter=b>.05&&t>=a.tin?`blur(${b}px)`:'none'}
 U.forEach(f=>f(t));
 const s=Math.min(Math.floor(t/STEP),S.steps.length-1);
 if(s!==S.shown){S.shown=s;const m=S.id==='map';$('#cap').innerHTML=`<b>${m?s:s+1}/${m?S.steps.length-1:S.steps.length}</b>`+S.steps[s];[...$('#dots').children].forEach((b,i)=>i===s?b.setAttribute('aria-current','true'):b.removeAttribute('aria-current'))}
 const i=ORDER.indexOf(S.id);$('#prog').style.width=100*(i+(s+1)/S.steps.length)/ORDER.length+'%'}

const factsHTML=r=>`${(r.facts||[]).map(([k,w])=>`<dt>${k}</dt><dd>${w}</dd>`).join('')}${r.chips?`<div class="chips">${r.chips.map(c=>`<span>${c}</span>`).join('')}</div>`:''}${r.flag?`<div class="flag"><span>${r.flag}</span></div>`:''}`;
function renderList(v){
 $('#list').replaceChildren(...v.rows.map((r,i)=>{const b=document.createElement('button');b.className='row';b.dataset.id=r.id;const on=r.id===S.id;b.setAttribute('aria-expanded',on);
  b.innerHTML=`<i>${String(i+1).padStart(2,'0')}</i><h3>${r.name}</h3><p>${r.desc}</p><u>${r.tag}</u>`+(on?`<dl class="more">${factsHTML(r)}</dl>`:'');
  b.onclick=()=>{openComp(r.id);if(innerWidth<1180)$('.right').scrollIntoView({behavior:still?'auto':'smooth',block:'start'})};return b}))}

function openComp(id,keepTour){
 if(S.mode==='read')setMode('explore',true);
 const v=VIEWS.find(x=>x.id===id);if(v)id=v.rows[0].id;
 const c=COMPS.find(x=>x.id===id),view=c?VIEWS.find(v=>v.id===c.view):null;
 if(!keepTour)S.tour=false;S.id=c?id:'map';S.view=c?c.view:'map';S.t=0;S.shown=-1;S.paused=false;S.hold=0;A=[];U=[];svg.replaceChildren();
 $('#cols').classList.toggle('is-map',!c);
 [...$('#tabs').children].forEach(b=>{const on=b.dataset.view===S.view;b.setAttribute('aria-selected',on)});
 if(c){svg.setAttribute('viewBox','0 0 650 520');S.steps=c.steps;$('#sec').textContent=`${String(VIEWS.indexOf(view)+1).padStart(2,'0')} / ${view.name}`;$('#sub').textContent=view.sub;$('#plabel').textContent=c.label;renderList(view);c.draw();
  $('#deep').innerHTML=`<h2>${c.name}</h2><p class="lede">${c.desc}.</p>`+c.deep}
 else{S.steps=TRACE.map(s=>s[0]);$('#sub').textContent=META.mapSub;$('#plabel').textContent=META.mapLabel;drawMap();$('#deep').innerHTML=META.mapDeep}
 const dots=$('#dots');dots.replaceChildren(...S.steps.map((_,i)=>{const b=document.createElement('button');b.className='dot';b.textContent=c?i+1:i;b.setAttribute('aria-label','Go to step '+(c?i+1:i));
  b.onclick=()=>{S.tour=false;S.paused=true;S.t=c?(i+1)*STEP-.02:i*STEP+.001;seek(S.t);syncPlay()};return b}));
 try{history.replaceState(null,'','#'+S.id)}catch{}
 if(!c)S.paused=!S.tour;
 if(still)S.t=c?S.steps.length*STEP-.01:0;
 seek(S.t);syncPlay()}

/* Reading mode: every chapter as one long document, each diagram drawn at its final frame. */
let built=false;
function buildDoc(){
 const doc=$('#doc'),toc=document.createElement('nav'),body=document.createElement('div');toc.className='toc';toc.setAttribute('aria-label','Contents');body.className='docbody';
 const intro=document.createElement('section');intro.className='docview';intro.id='doc-map';intro.innerHTML=`<header><span class="mono">00</span><h2>The life of a trade</h2><p>${META.mapSub}</p></header><div class="deep" style="border:0;padding:0;margin:0">${META.mapDeep}</div>`;body.appendChild(intro);
 toc.insertAdjacentHTML('beforeend',`<a class="v" href="#doc-map">00 · Overview</a>`);
 VIEWS.forEach((v,vi)=>{const sec=document.createElement('section');sec.className='docview';sec.id='doc-'+v.id;
  sec.innerHTML=`<header><span class="mono">${String(vi+1).padStart(2,'0')}</span><h2>${v.name}</h2><p>${v.sub}</p></header>`;
  toc.insertAdjacentHTML('beforeend',`<a class="v" href="#doc-${v.id}">${String(vi+1).padStart(2,'0')} · ${v.name}</a>`);
  v.rows.forEach(c=>{toc.insertAdjacentHTML('beforeend',`<a href="#doc-${c.id}">${c.name}</a>`);
   const it=document.createElement('article');it.className='docitem';it.id='doc-'+c.id;
   it.innerHTML=`<div class="deep"><h2>${c.name}</h2><p class="lede">${c.desc}.</p>${c.deep}</div><figure><figcaption>${c.label}</figcaption></figure><dl class="more">${factsHTML(c)}</dl>`;
   sec.appendChild(it);
   const fig=it.querySelector('figure'),s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 650 520');s.setAttribute('role','img');s.setAttribute('aria-label',c.label);fig.insertBefore(s,fig.firstChild);
   fig.insertAdjacentHTML('beforeend',`<figcaption style="text-transform:none;letter-spacing:0;font:400 13px var(--display);color:var(--soft)">${c.steps.map((x,i)=>`${i+1}. ${x}`).join('<br>')}</figcaption>`);
   const keep=[svg,A,U];svg=s;A=[];U=[];try{c.draw();U.forEach(f=>f(1e6))}catch(e){console.error(c.id,e)}[svg,A,U]=keep});
  body.appendChild(sec)});
 doc.replaceChildren(toc,body);
 doc.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();let id=a.getAttribute('href').slice(1);if(!id.startsWith('doc-'))id='doc-'+id;const t=document.getElementById(id);if(t)t.scrollIntoView({behavior:still?'auto':'smooth',block:'start'})});
 built=true}

function setMode(m,quiet){
 S.mode=m;const read=m==='read';$('#doc').hidden=!read;$('#cols').hidden=read;$('#foot-wrap').hidden=read;
 $('#mRead').setAttribute('aria-pressed',read);$('#mExplore').setAttribute('aria-pressed',!read);
 if(read){S.tour=false;syncPlay();$('#sub').textContent='The whole guide as one document, with every diagram at its final step.';if(!built)buildDoc();try{history.replaceState(null,'','#read')}catch{};scrollTo(0,0)}
 else if(!quiet)openComp(S.id)}

function syncPlay(){$('#play').textContent=S.tour?'Pause tour':'Play tour'}
function step(k){const i=(ORDER.indexOf(S.id)+k+ORDER.length)%ORDER.length;openComp(ORDER[i])}
function frame(now){const dt=Math.min(.1,(now-S.last)/1000||0);S.last=now;
 if(S.mode==='explore'){
  if(!S.paused){const end=S.steps.length*STEP-.01;
   if(S.t<end){S.t=Math.min(end,S.t+dt);seek(S.t)}
   else if(S.tour&&(!still||(S.hold+=dt)>4)){const i=ORDER.indexOf(S.id);i<ORDER.length-1?openComp(ORDER[i+1],true):(S.tour=false,syncPlay())}}
  else if(S.id==='map'&&S.shown>0&&!still){const b=S.shown*STEP;S.t=b+((S.t-b+dt)%(STEP-.01));seek(S.t)}}
 requestAnimationFrame(frame)}

$('#tabs').replaceChildren(...[{id:'map',name:META.mapTab},...VIEWS].map((v,i)=>{const b=document.createElement('button');b.className='tab';b.dataset.view=v.id;b.setAttribute('role','tab');b.innerHTML=`<b>${String(i).padStart(2,'0')}</b>${v.name}`;b.onclick=()=>openComp(v.id==='map'?'map':v.rows[0].id);return b}));
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
$('#play').onclick=()=>{S.tour=!S.tour;if(S.tour)S.paused=false;else if(S.id==='map')S.paused=true;syncPlay()};
$('#mRead').onclick=()=>setMode('read');$('#mExplore').onclick=()=>setMode('explore');
addEventListener('keydown',e=>{if(S.mode!=='explore'||e.target.closest('button,.go,a,input'))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id==='read'){setMode('read');return}if(id!==S.id&&(ORDER.includes(id)||VIEWS.some(v=>v.id===id))){openComp(id);$('.right').scrollIntoView({behavior:still?'auto':'smooth',block:'start'})}});
$('#brand').textContent='◆  '+META.name;$('#stamp').textContent=`Guide / ${VIEWS.length} views / ${COMPS.length} chapters / ${META.snapshot}`;$('#foot').textContent=META.footer;
$('#title').innerHTML=`${META.name}<em>${META.accent}</em>`;
const h0=location.hash.slice(1);if(h0==='read'){openComp('map');setMode('read')}else openComp(ORDER.includes(h0)||VIEWS.some(v=>v.id===h0)?h0:'map');
requestAnimationFrame(frame);
</script>
